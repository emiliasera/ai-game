<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<meta name="author" content="Emilia Sera">
<meta name="copyright" content="© 2026 Emilia Sera">

<meta name="description" content="AI Game Circle · Junior — gioco di discussione strutturata sull'AI Literacy per studenti 11-14 anni.">
<title>AI Game Circle · Junior</title>
<style>
:root{
 --petrol:#0E4D5C;--deep:#082E37;--paper:#FEFEFC;--ink:#26333A;--junior:#E8912D;--junior-dark:#B96614;
 --pro:#1E9E6A;--pro-dark:#14744D;--contro:#D64545;--contro-dark:#A83232;--purple:#7C4DBE;
 --si:#1E9E6A;--no:#D64545;--nonso:#2E86DE;--dipende:#E8912D;--gold:#F2B233;
 --dc1:#F2B233;--dc2:#488FCD;--dc3:#F89921;--dc4:#44A047;--dc5:#F26F63;
}
*{box-sizing:border-box} html{min-height:100%;background:var(--deep)}
body{margin:0;min-height:100vh;color:#fff;font-family:"Atkinson Hyperlegible",Arial,Verdana,sans-serif;background:
 radial-gradient(circle at 15% 20%,rgba(232,145,45,.20),transparent 38%),
 radial-gradient(circle at 85% 75%,rgba(124,77,190,.14),transparent 42%),
 linear-gradient(155deg,var(--petrol),var(--deep) 72%)}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.34;background-image:radial-gradient(rgba(255,255,255,.12) 1.2px,transparent 1.2px);background-size:34px 34px}
button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.38;cursor:not-allowed}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #fff;outline-offset:3px}
.app{position:relative;z-index:1;min-height:100vh;padding:22px 14px}.wrap{width:min(780px,100%);margin:auto}.wide{width:min(1000px,100%);margin:auto}.stack{display:grid;gap:16px}.row{display:flex;align-items:center;gap:10px}.center{text-align:center}.muted{opacity:.72}.tiny{font-size:.77rem}.small{font-size:.9rem}.display{font-family:Arial,Verdana,sans-serif;font-weight:900;letter-spacing:.025em}.title{font-size:clamp(2.2rem,8vw,4.2rem);line-height:.95;margin:.3rem 0}.subtitle{font-weight:900;letter-spacing:.28em;color:#ffd59f}.claim{font-style:italic}.spacer{height:6px}
.panel,.card{background:var(--paper);color:var(--ink);border-radius:20px;box-shadow:0 22px 44px -18px rgba(0,0,0,.66);position:relative;overflow:hidden}.panel{padding:20px}.card{border:3px solid var(--c,var(--junior))}.card-head{background:linear-gradient(90deg,var(--c),var(--c) 72%,transparent);color:#fff;font-weight:900;letter-spacing:.06em;padding:10px 16px;text-transform:uppercase;border-bottom-right-radius:18px}.card-body{padding:22px}.card-foot{padding:0 20px 14px;display:flex;justify-content:space-between;align-items:center;color:var(--c);font-size:.78rem;font-weight:900}.card::after{content:"";position:absolute;right:10px;top:8px;width:70px;height:45px;opacity:.22;background-image:radial-gradient(var(--c) 1.6px,transparent 1.6px);background-size:10px 10px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.people{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.btn{border:0;border-radius:14px;padding:12px 19px;background:var(--c,var(--junior));color:#fff;font-weight:900;box-shadow:0 10px 24px -11px var(--c,var(--junior))}.btn.ghost{background:rgba(255,255,255,.07);border:2px solid var(--c);box-shadow:none}.btn.slim{padding:8px 12px;font-size:.88rem}.btn.full{width:100%}
.field{width:100%;border:2px solid #d1d7df;border-radius:12px;padding:11px 13px;color:var(--ink);background:#fff}.player-row{display:grid;grid-template-columns:36px 1fr auto;gap:9px;align-items:center}.badge{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--junior);color:#fff;font-weight:900}.remove{border:0;background:#f2f4f6;color:#667085;width:34px;height:34px;border-radius:10px;font-weight:900}
.rolebox{border:2px solid var(--purple);border-radius:18px;padding:16px;background:rgba(255,255,255,.07)}.rolebox b{color:#d9c5ff}.circle-members{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.member{padding:7px 11px;border-radius:999px;background:rgba(255,255,255,.09)}.member.mod{background:var(--purple);font-weight:900}
.choice{border:3px solid var(--c);background:var(--paper);border-radius:18px;padding:18px 10px;color:var(--c);text-align:center;min-height:135px}.choice.selected{box-shadow:0 0 0 4px #fff,0 0 0 8px var(--c)}.choice .sym{font-size:2.5rem;font-weight:900}.choice .lab{font-size:1.2rem;font-weight:900}.choice .desc{font-size:.77rem;color:#667085;margin-top:4px}
.opinion-pill{display:inline-flex;align-items:center;gap:7px;border:2px solid var(--c);color:var(--c);border-radius:999px;padding:6px 10px;font-weight:900;background:#fff}.reveal-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:10px}
.hand{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.arg{border:2.5px solid var(--c);border-radius:16px;background:#fff;color:var(--ink);padding:13px;text-align:left;line-height:1.25;min-height:92px}.arg.pro{background:#EFF9F3}.arg.contro{background:#FDF1F1}.arg.selected{box-shadow:0 0 0 3px #fff,0 0 0 6px var(--c)}.arg .tag{font-weight:900;color:var(--c);display:block;font-size:.75rem;letter-spacing:.07em;margin-bottom:5px}.arg.none{border-style:dashed;background:#f7f7f7}.public-card{font-size:1.2rem;font-weight:800;line-height:1.5}
.note{border-left:4px solid var(--c,var(--junior));padding:10px 12px;background:rgba(255,255,255,.07);border-radius:8px}.dc-tags{display:flex;gap:6px;flex-wrap:wrap}.dc{color:#fff;border-radius:999px;padding:4px 9px;font-weight:900;font-size:.73rem;background:var(--c)}.credits{padding:13px 15px;border:1px solid rgba(255,255,255,.18);border-radius:14px;background:rgba(255,255,255,.055);text-align:left}.credits b{color:#ffe2b9}.topbar{width:min(920px,100%);margin:0 auto 18px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:.86rem}.roundinfo{font-weight:900;letter-spacing:.08em}.change{border:3px solid var(--c,var(--junior));padding:15px;border-radius:18px;background:#fff;color:var(--ink)}.arrow{font-size:1.4rem;color:#98a2b3}.summary-item{border-left:4px solid var(--junior);padding:10px 12px;background:#fff;color:var(--ink);border-radius:10px}
@media(max-width:660px){.grid3,.grid4{grid-template-columns:1fr 1fr}.hand{grid-template-columns:1fr}.topbar{align-items:flex-start;flex-direction:column}.app{padding:18px 11px}.card-body{padding:18px}}@media(max-width:420px){.grid2,.grid3,.grid4{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.modhelp{text-align:left}.modhelp summary{cursor:pointer;font-weight:900;color:#d9c5ff;padding:8px 0;text-align:center}@media(max-width:660px){.modgrid{grid-template-columns:1fr}}.opt{display:flex;gap:10px;align-items:flex-start;font-size:.9rem;line-height:1.35;cursor:pointer;text-align:left}.opt input{color-scheme:light;accent-color:#1E8A3C;width:20px;height:20px;flex:0 0 20px;margin-top:2px}textarea.field{resize:vertical}
</style>
</head>
<body><main id="app" class="app" aria-live="polite"></main>
<script>
"use strict";
const SITUAZIONI=[{"n":1,"titolo":"La ricerca last-minute","testo":"La sera prima della consegna faccio fare tutta la ricerca all'IA. La stampo e la consegno senza nemmeno leggerla.","dc":["DC1","DC3"]},{"n":2,"titolo":"Il filtro perfetto","testo":"Un'amica pubblica solo foto modificate con filtri IA. Dice che senza filtri non si piace più.","dc":["DC4"]},{"n":3,"titolo":"Il deepfake del compagno","testo":"Un compagno mette la faccia di un altro su un video buffo con un'app di IA e lo condivide nel gruppo classe. L'altro non lo sapeva.","dc":["DC2","DC4"]},{"n":4,"titolo":"L'app che risolve","testo":"Fotografo l'esercizio di matematica e l'app me lo risolve in un secondo. Ho iniziato a usarla ogni sera, per tutti i compiti.","dc":["DC5"]},{"n":5,"titolo":"La traduzione in classe","testo":"È arrivato un compagno che non parla italiano. La prof usa l'IA per tradurre le consegne nella sua lingua e aiutarlo a seguire.","dc":["DC2","DC4"]},{"n":6,"titolo":"I video consigliati","testo":"L'app mi propone sempre video simili a quelli che ho già guardato. Ne guardo uno dietro l'altro per ore. Chi sta scegliendo: io o l'algoritmo?","dc":["DC4","DC5"]},{"n":7,"titolo":"L'influencer che non esiste","testo":"Seguo un profilo con migliaia di follower. Un giorno scopro che quella persona non esiste: è interamente generata dall'IA.","dc":["DC1","DC4"]},{"n":8,"titolo":"Il chatbot confidente","testo":"Ogni sera parlo con un chatbot dei miei problemi, perché mi ascolta sempre e non mi giudica mai. Ma dove finiscono le mie parole?","dc":["DC4"]},{"n":9,"titolo":"La notizia incredibile","testo":"Nel gruppo classe gira una notizia clamorosa, con tanto di foto. Sembra vera, ma foto e testo sono stati generati dall'IA.","dc":["DC1","DC2"]},{"n":10,"titolo":"Il quiz del prof","testo":"Il prof usa l'IA per generare un quiz di verifica. Due risposte sono sbagliate: ce ne accorgiamo noi studenti, non lui.","dc":["DC1"]},{"n":11,"titolo":"Le parole difficili","testo":"Non capisco un concetto del libro. Chiedo all'IA di spiegarmelo con parole semplici e un esempio. Adesso l'ho capito davvero.","dc":["DC1","DC5"]},{"n":12,"titolo":"La voce clonata","testo":"Nel gruppo classe circola un audio con la voce imitata di una prof, creato con un'app. Tutti ridono. La prof no.","dc":["DC2","DC4"]},{"n":13,"titolo":"Il messaggio di scuse","testo":"Ho litigato con un amico. Faccio scrivere all'IA il messaggio di scuse perfetto. Lui non sa che non l'ho scritto io.","dc":["DC2","DC3"]},{"n":14,"titolo":"Il tema che non è mio","testo":"Faccio generare il tema all'IA e lo presento come mio. La prof lo legge in classe come esempio da seguire.","dc":["DC3"]},{"n":15,"titolo":"Il gruppo di studio","testo":"Prima della verifica ci troviamo in tre e chiediamo all'IA di farci domande a turno, come un'interrogazione. Ripassiamo così.","dc":["DC2","DC5"]},{"n":16,"titolo":"Libri o IA?","testo":"Per una ricerca metà classe usa i libri e i siti ufficiali, metà usa solo l'IA. Chi trova le informazioni più affidabili?","dc":["DC1"]},{"n":17,"titolo":"La musica della festa","testo":"Per la festa della scuola facciamo comporre la base musicale all'IA. La presentiamo come creazione del nostro gruppo.","dc":["DC3"]},{"n":18,"titolo":"Il compito perfetto ma vuoto","testo":"Faccio fare il compito all'IA. È tutto giusto e prendo un bel voto. Ma io non ho capito niente.","dc":["DC5"]},{"n":19,"titolo":"L'immagine del futuro","testo":"Per scienze genero un'immagine della mia città tra 100 anni con il clima cambiato. È così realistica che sembra una foto vera.","dc":["DC1","DC3"]},{"n":20,"titolo":"La prof e l'IA","testo":"La prof usa l'IA per preparare materiali e verifiche. Ci dice sempre: «Prima di portarvelo in classe, lo controllo io».","dc":["DC1","DC5"]},{"n":21,"titolo":"L'app che sa tutto di me","testo":"Un'app gratuita mi propone esercizi personalizzati sul mio livello. Ma per funzionare chiede tantissimi dati su di me.","dc":["DC4"]},{"n":22,"titolo":"La mappa imparata a memoria","testo":"Mi faccio generare dall'IA una mappa concettuale perfetta e la studio a memoria. Il prof mi chiede un collegamento e mi blocco.","dc":["DC1","DC5"]},{"n":23,"titolo":"Il compagno che copia sempre","testo":"Un compagno fa fare tutti i compiti all'IA. A casa prende bei voti, ma alle verifiche in classe non sa niente.","dc":["DC5"]},{"n":24,"titolo":"Il fatto inventato","testo":"Confrontiamo le risposte dell'IA con le fonti della biblioteca. Scopriamo che l'IA ha inventato un evento storico mai accaduto!","dc":["DC1"]},{"n":25,"titolo":"Il diario riscritto","testo":"Scrivo i miei pensieri su un'app con IA che corregge e «migliora» tutto. Rileggendo, però, quelle parole non sembrano più mie.","dc":["DC3","DC4"]},{"n":26,"titolo":"Il disegno troppo perfetto","testo":"Al concorso artistico della scuola vince un'opera bellissima. Poi si scopre che è stata generata con l'IA. Ne discutiamo tutti insieme.","dc":["DC3"]}];
const PRO=["L'IA può spiegare la stessa cosa in tanti modi diversi","L'IA fa risparmiare tempo nei compiti ripetitivi","L'IA aiuta chi ha difficoltà o una disabilità","L'IA traduce e abbatte le barriere linguistiche","L'IA è disponibile sempre, anche quando nessuno può aiutarti","L'IA può darmi idee da cui partire","Con l'IA posso controllare se ho capito bene","L'IA può rendere le lezioni più varie e interattive","L'IA aiuta a organizzare lo studio: mappe, schemi, quiz","Saper usare bene l'IA sarà importante per il mio futuro","L'IA può adattare gli esercizi al mio livello","L'IA può rendere comprensibili testi difficili","Con l'IA posso creare musica, immagini e video anche senza tecnica","L'IA può aiutarmi a scrivere meglio, se poi controllo io","L'IA può simulare esperimenti impossibili da fare in classe","Con l'IA posso esplorare argomenti che a scuola non si fanno","All'IA posso fare domande senza vergognarmi","Usare l'IA insieme ci fa discutere e ragionare"];
const CONTRO=["L'IA può sbagliare e inventare cose false","Se delego tutto all'IA, io non imparo","L'IA non conosce me e la mia situazione","I miei dati e i miei segreti possono finire in mani sbagliate","L'IA può creare immagini e voci false (deepfake)","Presentare come mio ciò che ha fatto l'IA non è onesto","L'IA consuma molta energia e molta acqua","Gli algoritmi decidono cosa vedo e possono chiudermi in una bolla","L'IA può copiare lo stile di artisti e autori senza permesso","L'IA non prova emozioni: non è un amico vero","Rischio di passare troppo tempo davanti allo schermo","Non sempre so da dove vengono le informazioni dell'IA","L'IA può ripetere pregiudizi e stereotipi","Se tutti usano l'IA, i lavori finiscono per somigliarsi","Dipendere dall'IA mi rende meno autonomo","Le app «gratuite» spesso si pagano con i nostri dati","L'IA può essere usata per prendere in giro o ferire qualcuno","Chi non ha accesso all'IA rischia di restare indietro"];
const OPINIONI=[{"id":"SI","label":"SÌ!","desc":"Sono d'accordo.","col":"#1E9E6A","sym":"✓"},{"id":"NO","label":"NO!","desc":"Non sono d'accordo.","col":"#D64545","sym":"×"},{"id":"NONSO","label":"NON SO","desc":"...e dico cosa mi manca per decidere.","col":"#2E86DE","sym":"?"},{"id":"DIPENDE","label":"DIPENDE","desc":"...e spiego da che cosa dipende.","col":"#E8912D","sym":"~"}];
const DC_COL={DC1:'var(--dc1)',DC2:'var(--dc2)',DC3:'var(--dc3)',DC4:'var(--dc4)',DC5:'var(--dc5)'};
const DELICATE=[3,8,12];
const RILANCI=["Perché la pensi così?","Che cosa cambierebbe se…?","Chi ci guadagna e chi ci perde?","Quale informazione ti servirebbe per decidere?","E se fosse successo a te?"];
const REGOLE=[["NON SO","dici che cosa ti manca per decidere."],["DIPENDE","spieghi da che cosa dipende."],["UNA CARTA","per turno, oppure parole tue."],["CAMBI IDEA?","dici quale argomento ti ha convinto."]];
const app=document.getElementById('app');
const DEFAULT_NAMES=['','',''];
let state={fase:'setup',players:[...DEFAULT_NAMES],rounds:3,mazzo:[],round:0,sit:null,moderator:0,hands:{},initial:{},final:{},opPos:0,opStage:'pass',speakPos:0,speakStage:'pass',playSel:null,changePos:0,changeStage:'pass',history:[],bianca:{titolo:'',testo:'',dc1:'DC1',dc2:''},avvocato:false};
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function shuffle(a){const x=[...a];for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]];}return x}
function logo(size=66){return `<svg width="${size}" height="${size}" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="29" fill="none" stroke="rgba(255,255,255,.9)" stroke-width="5"/><circle cx="50" cy="21" r="9" fill="#0FA3A3" stroke="#fff" stroke-width="4"/><circle cx="22" cy="42" r="9" fill="#F2B233" stroke="#fff" stroke-width="4"/><circle cx="32" cy="76" r="9" fill="#7C4DBE" stroke="#fff" stroke-width="4"/><circle cx="68" cy="76" r="9" fill="#2E86DE" stroke="#fff" stroke-width="4"/><circle cx="78" cy="42" r="9" fill="#D64545" stroke="#fff" stroke-width="4"/></svg>`}
function btn(label,color='var(--junior)',attrs=''){return `<button class="btn" style="--c:${color}" ${attrs}>${label}</button>`}
function card(color,head,body,foot=''){return `<section class="card" style="--c:${color}"><div class="card-head">${head}</div><div class="card-body">${body}</div>${foot?`<div class="card-foot"><span>${foot}</span>${logo(26)}</div>`:''}</section>`}
function credits(){return `<aside class="credits tiny"><b>Attribuzione e licenza</b><div>AI Game Circle · Junior — Emilia Sera · www.edugem.it</div><div>© 2026 Emilia Sera · CC BY-NC-SA 4.0</div></aside>`}
function topbarHtml(){if(['setup','summary'].includes(state.fase))return '';return `<div class="topbar"><div class="row">${logo(28)}<span class="roundinfo">SITUAZIONE ${state.round+1}/${state.rounds}</span></div><div class="tiny">MODERATORE · <b style="color:#d9c5ff">${esc(state.players[state.moderator])}</b></div></div>`}
function shell(content){app.innerHTML=topbarHtml()+content;window.scrollTo(0,0)}
function active(){const n=state.players.length,out=[];for(let k=1;k<n;k++)out.push((state.moderator+k)%n);return out}
function opBy(id){return OPINIONI.find(o=>o.id===id)}
function opHtml(id){const o=opBy(id);return `<span class="opinion-pill" style="--c:${o.col}"><span>${esc(o.sym)}</span>${esc(o.label)}</span>`}
function dcTags(tags){return `<div class="dc-tags">${tags.map(d=>`<span class="dc" style="--c:${DC_COL[d]}">${d}</span>`).join('')}</div>`}
function modCards(){const h='margin:0 0 4px;color:#58338E',t='margin:0 0 8px;color:#667085';return `<div class="grid2 modgrid" style="text-align:left">${card('var(--purple)','⭐ Moderatore',`<h3 class="display" style="${h}">Domande per rilanciare</h3><p class="tiny" style="${t}"><i>Usale quando il giro di parola si ferma.</i></p>${RILANCI.map(q=>`<p style="margin:.4rem 0">★ ${esc(q)}</p>`).join('')}`)}${card('var(--purple)','⭐ Moderatore',`<h3 class="display" style="${h}">Regole d’oro del cerchio</h3><p class="tiny" style="${t}"><i>Ricordale a tutti prima di scoprire le carte.</i></p>${REGOLE.map(r=>`<p style="margin:.4rem 0"><b style="color:var(--purple)">${esc(r[0])}</b><br>${esc(r[1])}</p>`).join('')}`)}</div>`}
function modHelp(){return `<details class="modhelp"><summary>⭐ Aiuto per il Moderatore</summary>${modCards()}</details>`}
function setPhase(f){state.fase=f;render()}
function addPlayer(){if(state.players.length<6){state.players.push('');render()}}
function removePlayer(i){if(state.players.length>3){state.players.splice(i,1);state.rounds=Math.min(state.rounds,6);render()}}
function renderSetup(){shell(`<div class="wrap stack"><header class="center stack" style="gap:7px">${logo(82)}<h1 class="display title">AI GAME <span style="color:var(--junior)">CIRCLE</span></h1><div class="subtitle">JUNIOR</div><p class="muted">11-14 anni · 3-6 partecipanti · Moderatore a rotazione</p><p class="claim">Non si vince. Si esplora.</p></header><section class="panel stack"><h2 class="display" style="margin:0;color:var(--petrol)">👥 Il cerchio</h2><div id="players">${state.players.map((n,i)=>`<div class="player-row"><span class="badge">${i+1}</span><input class="field pname" data-i="${i}" maxlength="22" placeholder="Nome partecipante ${i+1}" value="${esc(n)}"><button class="remove" data-remove="${i}" ${state.players.length<=3?'disabled':''} aria-label="Rimuovi">×</button></div>`).join('')}</div><div class="row" style="justify-content:space-between;flex-wrap:wrap">${btn('+ Aggiungi partecipante','var(--petrol)',`id=addPlayer ${state.players.length>=6?'disabled':''}`)}<label class="small">Situazioni da giocare <select class="field" id="rounds" style="width:auto;margin-left:6px">${[2,3,4,5,6].map(n=>`<option value="${n}" ${state.rounds===n?'selected':''}>${n}</option>`).join('')}</select></label></div><div class="note small" style="--c:var(--junior)"><b>Niente punti, niente classifica, niente timer obbligatorio.</b> Per far moderare tutti una volta nella stessa sessione, scegli un numero di situazioni uguale al numero dei partecipanti.</div></section><section class="panel stack"><h2 class="display" style="margin:0;color:var(--petrol)">⚙️ Varianti <span class="tiny" style="font-weight:400;color:#667085">(facoltative)</span></h2><label class="opt"><input type="checkbox" id="optAvv" ${state.avvocato?'checked':''}> <span><b>Avvocato del diavolo</b> · chi ha scelto SÌ gioca una carta CONTRO, chi ha scelto NO una carta PRO; con NON SO o DIPENDE una carta a scelta. È la variante-ponte verso AI Game Debate.</span></label><div class="stack" style="gap:8px"><div><b>✏️ Carta bianca</b><div class="small" style="color:#667085">Proponete una situazione plausibile; il docente la riformula in modo neutro e anonimo. Se compili il testo, sarà la prima situazione del cerchio.</div></div><input class="field" id="bTit" maxlength="40" placeholder="Titolo della situazione" value="${esc(state.bianca.titolo)}"><textarea class="field" id="bTxt" rows="3" maxlength="260" placeholder="Scrivi qui una nuova situazione">${esc(state.bianca.testo)}</textarea><div class="row" style="flex-wrap:wrap"><span class="small"><b>Aree DigComp</b></span><select class="field" id="bDc1" style="width:auto" aria-label="Prima area DigComp">${['DC1','DC2','DC3','DC4','DC5'].map(d=>`<option ${state.bianca.dc1===d?'selected':''}>${d}</option>`).join('')}</select><select class="field" id="bDc2" style="width:auto" aria-label="Seconda area DigComp (facoltativa)"><option value="">—</option>${['DC1','DC2','DC3','DC4','DC5'].map(d=>`<option ${state.bianca.dc2===d?'selected':''}>${d}</option>`).join('')}</select></div></div></section><div class="center">${btn('INIZIA IL CERCHIO','var(--junior)','id=start disabled')}</div>${credits()}</div>`);
 document.querySelectorAll('.pname').forEach(el=>el.oninput=e=>{state.players[+e.target.dataset.i]=e.target.value;document.getElementById('start').disabled=state.players.some(x=>!x.trim())});
 document.querySelectorAll('[data-remove]').forEach(el=>el.onclick=()=>removePlayer(+el.dataset.remove));document.getElementById('addPlayer').onclick=addPlayer;document.getElementById('rounds').onchange=e=>state.rounds=+e.target.value;document.getElementById('optAvv').onchange=e=>{state.avvocato=e.target.checked};document.getElementById('bTit').oninput=e=>{state.bianca.titolo=e.target.value};document.getElementById('bTxt').oninput=e=>{state.bianca.testo=e.target.value};document.getElementById('bDc1').onchange=e=>{state.bianca.dc1=e.target.value};document.getElementById('bDc2').onchange=e=>{state.bianca.dc2=e.target.value};const b=document.getElementById('start');b.disabled=state.players.some(x=>!x.trim());b.onclick=startGame;
}
function startGame(){state.players=state.players.map(x=>x.trim());state.mazzo=shuffle(SITUAZIONI).slice(0,state.rounds);if(state.bianca.testo.trim())state.mazzo[0]={n:0,titolo:state.bianca.titolo.trim()||'Carta bianca',testo:state.bianca.testo.trim(),dc:[state.bianca.dc1,state.bianca.dc2].filter((x,i,a)=>x&&a.indexOf(x)===i),custom:true};state.round=0;state.history=[];prepareRound()}
function prepareRound(){state.sit=state.mazzo[state.round];state.moderator=state.round%state.players.length;state.initial={};state.final={};state.hands={};const act=active();const proDeck=shuffle(PRO.map((t,i)=>({i,t})));const conDeck=shuffle(CONTRO.map((t,i)=>({i,t})));act.forEach((pi,k)=>{state.hands[pi]={pro:proDeck.slice(k*2,k*2+2),contro:conDeck.slice(k*2,k*2+2)}});state.opPos=0;state.opStage='pass';state.speakPos=0;state.speakStage='pass';state.playSel=null;state.changePos=0;state.changeStage='pass';state.fase='roundIntro';render()}
function renderRoundIntro(){const mod=state.players[state.moderator];shell(`<div class="wrap center stack"><h2 class="display">Nuova situazione</h2><div class="rolebox"><div style="font-size:2.5rem">⭐</div><div class="tiny">MODERATORE</div><h3 class="display" style="margin:.3rem;color:#fff">${esc(mod)}</h3><p class="small muted">Pesca, leggi e gestisci il giro di parola. Non esprimi la tua opinione e non ricevi carte PRO/CONTRO.</p></div><div class="circle-members">${state.players.map((n,i)=>`<span class="member ${i===state.moderator?'mod':''}">${esc(n)}</span>`).join('')}</div>${modCards()}${btn('Pesca la situazione ➜','var(--junior)','id=goSit')}</div>`);document.getElementById('goSit').onclick=()=>setPhase('situation')}
function renderSituation(){const s=state.sit;shell(`<div class="wrap stack">${card('var(--junior)','SITUAZIONE',`<h2 class="display" style="color:var(--junior-dark);margin-top:0">${esc(s.titolo)}</h2><p style="font-size:1.15rem;line-height:1.55">${esc(s.testo)}</p>${dcTags(s.dc)}`,s.custom?'Carta bianca · JUNIOR':`N. ${s.n} · JUNIOR`)}${DELICATE.includes(s.n)?`<div class="note small" style="--c:var(--contro)"><b>⚠ Situazione delicata.</b> Non trasformatela in un caso personale della classe: restate sullo scenario generale. Il docente dedica qualche minuto alla sintesi al termine del giro.</div>`:''}<div class="center"><p class="small muted">⭐ <b>${esc(state.players[state.moderator])}</b> legge ad alta voce, senza commentare.</p>${btn('Opinioni segrete ➜','var(--junior)','id=toOpinions')}</div></div>`);document.getElementById('toOpinions').onclick=()=>setPhase('opinions')}
function renderOpinions(){const act=active();if(state.opPos>=act.length){state.fase='reveal';render();return}const pi=act[state.opPos],name=state.players[pi];if(state.opStage==='pass'){shell(`<div class="wrap center stack" style="max-width:520px;padding-top:28px"><div style="font-size:4rem">🤫</div><h2 class="display">Passa il dispositivo a <span style="color:var(--junior)">${esc(name)}</span></h2><p class="muted">Scegli la tua opinione in segreto. Il Moderatore e gli altri non guardano.</p>${btn(`Sono ${esc(name)}, continua`,'var(--junior)','id=ready')}</div>`);document.getElementById('ready').onclick=()=>{state.opStage='choose';render()};return}const cur=state.initial[pi];shell(`<div class="wrap center stack"><h2 class="display">La tua opinione</h2><p class="muted small">Che cosa pensi della situazione, prima di ascoltare gli altri?</p><div class="grid2">${OPINIONI.map(o=>`<button class="choice ${cur===o.id?'selected':''}" style="--c:${o.col}" data-op="${o.id}"><div class="sym">${esc(o.sym)}</div><div class="lab">${esc(o.label)}</div><div class="desc">${esc(o.desc)}</div></button>`).join('')}</div>${btn('Conferma e nascondi','var(--junior)',`id=confirm ${cur?'':'disabled'}`)}</div>`);document.querySelectorAll('[data-op]').forEach(el=>el.onclick=()=>{state.initial[pi]=el.dataset.op;render()});document.getElementById('confirm').onclick=()=>{state.opPos++;state.opStage='pass';render()}}
function renderReveal(){const act=active();shell(`<div class="wide center stack"><h2 class="display">Tutti insieme: scopriamo!</h2><p class="muted">Osservate le differenze senza commentarle ancora.</p><div class="reveal-grid">${act.map(pi=>{const o=opBy(state.initial[pi]);return `<div class="panel" style="border:3px solid ${o.col}"><b>${esc(state.players[pi])}</b><div class="spacer"></div>${opHtml(o.id)}</div>`}).join('')}</div><div class="note small" style="--c:var(--junior)">⭐ Il Moderatore dà la parola seguendo il cerchio. Ognuno spiega <b>perché</b> ha scelto quella posizione.</div>${modHelp()}${btn('Inizia il giro di parola ➜','var(--junior)','id=speak')}</div>`);document.getElementById('speak').onclick=()=>setPhase('speak')}
function renderSpeak(){const act=active();if(state.speakPos>=act.length){state.fase='change';state.changePos=0;state.changeStage='pass';render();return}const pi=act[state.speakPos],name=state.players[pi],hand=state.hands[pi],op=opBy(state.initial[pi]);if(state.speakStage==='pass'){shell(`<div class="wrap center stack" style="max-width:520px;padding-top:24px"><div style="font-size:3.5rem">🃏</div><h2 class="display">Tocca a <span style="color:var(--junior)">${esc(name)}</span></h2><p class="muted">La tua opinione è ${opHtml(op.id)}. Guarda le tue 2 PRO e 2 CONTRO e scegli se usarne una.</p>${btn(`Mostrami le mie carte`,'var(--junior)','id=showHand')}</div>`);document.getElementById('showHand').onclick=()=>{state.speakStage='choose';state.playSel=null;render()};return}if(state.speakStage==='choose'){const choice=state.playSel;const cards=[...hand.pro.map(x=>({...x,type:'pro'})),...hand.contro.map(x=>({...x,type:'contro'}))].filter(x=>!state.avvocato||(op.id==='SI'?x.type==='contro':op.id==='NO'?x.type==='pro':true));shell(`<div class="wide stack"><div class="center"><h2 class="display">${esc(name)} · scegli il supporto</h2><p class="small muted">${state.avvocato?'😈 Avvocato del diavolo: gioca una carta contraria alla tua opinione (con NON SO o DIPENDE, una a scelta) e collegala alla situazione.':'Puoi usare una carta, anche contraria alla tua opinione, oppure parlare senza carta.'}</p></div><div class="hand">${cards.map((x,idx)=>`<button class="arg ${x.type} ${choice===x.type+':'+x.i?'selected':''}" style="--c:${x.type==='pro'?'var(--pro)':'var(--contro)'}" data-card="${x.type}:${x.i}"><span class="tag">${x.type==='pro'?'PRO +':'CONTRO −'}</span>${esc(x.t)}</button>`).join('')}${state.avvocato?'':`<button class="arg none ${choice==='none'?'selected':''}" style="--c:var(--junior)" data-card="none"><span class="tag" style="color:var(--junior-dark)">SENZA CARTA</span>Argomento con parole mie.</button>`}</div><div class="center">${btn('Conferma e parla ➜','var(--junior)',`id=public ${choice?'':'disabled'}`)}</div></div>`);document.querySelectorAll('[data-card]').forEach(el=>el.onclick=()=>{state.playSel=el.dataset.card;render()});document.getElementById('public').onclick=()=>{state.speakStage='public';render()};return}let publicHtml;if(state.playSel==='none')publicHtml=card('var(--junior)','PAROLE MIE',`<div class="public-card">Spiega la tua posizione con un esempio, una ragione o una condizione concreta.</div>`);else{const [typ,idxs]=state.playSel.split(':'),idx=+idxs,t=(typ==='pro'?PRO:CONTRO)[idx],col=typ==='pro'?'var(--pro)':'var(--contro)';publicHtml=card(col,typ==='pro'?'PRO +':'CONTRO −',`<div class="public-card">${esc(t)}</div>`)}shell(`<div class="wrap stack"><div class="center"><h2 class="display">Giro di parola · ${esc(name)}</h2><p class="muted">Opinione iniziale: ${opHtml(op.id)}</p></div>${publicHtml}<div class="note small" style="--c:var(--junior)"><b>Parla:</b> collega la carta alla situazione. Gli altri ascoltano senza interrompere.</div>${modHelp()}<div class="center">${btn(state.speakPos<act.length-1?'Passa al prossimo ➜':'Giro completato ➜','var(--junior)','id=nextSpeak')}</div></div>`);document.getElementById('nextSpeak').onclick=()=>{state.speakPos++;state.speakStage='pass';state.playSel=null;render()}}
function renderChange(){const act=active();if(state.changePos>=act.length){state.fase='changeReveal';render();return}const pi=act[state.changePos],name=state.players[pi],initial=opBy(state.initial[pi]);if(state.changeStage==='pass'){shell(`<div class="wrap center stack" style="max-width:520px;padding-top:28px"><div style="font-size:4rem">🔁</div><h2 class="display">Passa il dispositivo a <span style="color:var(--junior)">${esc(name)}</span></h2><p class="muted">Dopo aver ascoltato tutti, puoi confermare o cambiare la tua opinione.</p>${btn(`Sono ${esc(name)}, continua`,'var(--junior)','id=readyChange')}</div>`);document.getElementById('readyChange').onclick=()=>{state.changeStage='choose';render()};return}const cur=state.final[pi]||state.initial[pi];shell(`<div class="wrap center stack"><h2 class="display">Vuoi cambiare idea?</h2><p class="small muted">Prima avevi scelto ${opHtml(initial.id)}. Non è obbligatorio cambiare.</p><div class="grid2">${OPINIONI.map(o=>`<button class="choice ${cur===o.id?'selected':''}" style="--c:${o.col}" data-final="${o.id}"><div class="sym">${esc(o.sym)}</div><div class="lab">${esc(o.label)}</div><div class="desc">${esc(o.desc)}</div></button>`).join('')}</div>${btn('Conferma','var(--junior)','id=confirmChange')}</div>`);document.querySelectorAll('[data-final]').forEach(el=>el.onclick=()=>{state.final[pi]=el.dataset.final;render()});document.getElementById('confirmChange').onclick=()=>{if(!state.final[pi])state.final[pi]=state.initial[pi];state.changePos++;state.changeStage='pass';render()}}
function finishRound(){const act=active();const changes=act.filter(pi=>state.initial[pi]!==state.final[pi]);state.history.push({sit:state.sit,moderator:state.players[state.moderator],initial:{...state.initial},final:{...state.final},changes:changes.length});if(state.round<state.rounds-1){state.round++;prepareRound()}else{state.fase='summary';render()}}
function renderChangeReveal(){const act=active();shell(`<div class="wide center stack"><h2 class="display">Qualcuno ha cambiato idea?</h2><div class="reveal-grid">${act.map(pi=>{const a=opBy(state.initial[pi]),b=opBy(state.final[pi]);const changed=a.id!==b.id;return `<div class="change" style="--c:${changed?'var(--junior)':'var(--petrol)'}"><b>${esc(state.players[pi])}</b><div class="row" style="justify-content:center;margin-top:10px">${opHtml(a.id)}<span class="arrow">→</span>${opHtml(b.id)}</div><div class="tiny" style="margin-top:8px;color:${changed?'var(--junior-dark)':'#667085'}">${changed?'Ha cambiato posizione':'Ha confermato la posizione'}</div></div>`}).join('')}</div><div class="note small" style="--c:var(--junior)">Chi ha cambiato idea spiega <b>quale argomento</b> ha inciso. Chi non ha cambiato può dire quale argomento ha rafforzato la propria posizione.</div>${btn(state.round<state.rounds-1?'Nuova situazione · ruota il Moderatore ➜':'Vai alla restituzione finale ➜','var(--junior)','id=finish')}</div>`);document.getElementById('finish').onclick=finishRound}
function renderSummary(){const totalChanges=state.history.reduce((s,r)=>s+r.changes,0);shell(`<div class="wrap center stack" style="padding-top:18px">${logo(76)}<h2 class="display">Restituzione finale</h2><p class="claim muted">AI Game Circle non si vince. Si esplora.</p><div class="panel"><div class="display" style="font-size:2.4rem;color:var(--junior)">${totalChanges}</div><div class="small">cambi di opinione emersi nel cerchio</div><div class="tiny muted">Non è un punteggio: è solo una traccia del processo di ascolto.</div></div><div class="stack" style="text-align:left">${state.history.map((h,i)=>`<div class="summary-item"><b>${i+1}. ${esc(h.sit.titolo)}</b><br><span class="tiny">Moderatore: ${esc(h.moderator)} · Cambi di opinione: ${h.changes} · ${h.sit.dc.join(' + ')}</span></div>`).join('')}</div><section class="panel" style="text-align:left"><h3 class="display" style="color:var(--petrol);margin-top:0">Tre domande per chiudere</h3><p>1. Quale argomento ti ha fatto pensare di più?</p><p>2. C’è stato un NON SO o un DIPENDE interessante? Che cosa mancava o da cosa dipendeva?</p><p>3. In quale situazione useresti l’IA solo a certe condizioni?</p></section>${btn('↺ Nuova partita','var(--junior)','id=restart')}${credits()}</div>`);document.getElementById('restart').onclick=()=>{state={fase:'setup',players:[...DEFAULT_NAMES],rounds:3,mazzo:[],round:0,sit:null,moderator:0,hands:{},initial:{},final:{},opPos:0,opStage:'pass',speakPos:0,speakStage:'pass',playSel:null,changePos:0,changeStage:'pass',history:[],bianca:{titolo:'',testo:'',dc1:'DC1',dc2:''},avvocato:false};render()}}
function render(){switch(state.fase){case'setup':renderSetup();break;case'roundIntro':renderRoundIntro();break;case'situation':renderSituation();break;case'opinions':renderOpinions();break;case'reveal':renderReveal();break;case'speak':renderSpeak();break;case'change':renderChange();break;case'changeReveal':renderChangeReveal();break;case'summary':renderSummary();break}}
render();
</script></body></html>
