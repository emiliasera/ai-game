<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<meta name="author" content="Emilia Sera">
<meta name="copyright" content="© 2026 Emilia Sera">

<meta name="description" content="AI Game Circle · Kids — gioco in cerchio sull'AI Literacy per la scuola primaria, 9-11 anni.">
<title>AI Game Circle · Kids</title>
<style>
:root{--cream:#FFF8EB;--cream2:#F4F8EC;--paper:#fff;--ink:#26343b;--petrol:#164C59;--petrol2:#0D3540;--kids:#58A94B;--kidsd:#357C31;--green:#1E9E6A;--red:#D64545;--blue:#2E86DE;--orange:#E8912D;--purple:#7C4DBE;--pink:#D9538C;--yellow:#F2B233}
*{box-sizing:border-box}html{background:var(--cream)}body{margin:0;min-height:100vh;font-family:Arial,Verdana,sans-serif;color:var(--ink);background:radial-gradient(circle at 12% 15%,rgba(88,169,75,.15),transparent 32%),radial-gradient(circle at 88% 20%,rgba(232,145,45,.15),transparent 34%),radial-gradient(circle at 18% 85%,rgba(124,77,190,.10),transparent 35%),linear-gradient(160deg,var(--cream),var(--cream2));}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.28;background-image:radial-gradient(var(--kids) 1.3px,transparent 1.3px),radial-gradient(var(--orange) 1.2px,transparent 1.2px);background-size:54px 54px,74px 74px;background-position:0 0,24px 32px}.app{position:relative;z-index:1;min-height:100vh;padding:22px 14px}.wrap{width:min(700px,100%);margin:auto}.wide{width:min(950px,100%);margin:auto}.stack{display:grid;gap:16px}.center{text-align:center}.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.display{font-weight:900;letter-spacing:.02em}.title{font-size:clamp(2.2rem,8vw,4rem);line-height:.95;margin:.2rem 0;color:var(--petrol)}.subtitle{font-weight:900;letter-spacing:.24em;color:var(--kidsd);font-size:.82rem}.muted{color:#68747a}.small{font-size:.9rem}.tiny{font-size:.76rem}.claim{font-style:italic}.panel,.card{background:var(--paper);border-radius:22px;box-shadow:0 18px 38px -22px rgba(22,76,89,.45)}.panel{padding:20px}.card{overflow:hidden;border:3px solid var(--c,var(--kids));position:relative}.card-head{background:var(--c,var(--kids));color:#fff;font-weight:900;padding:11px 16px;letter-spacing:.05em;text-transform:uppercase}.card-body{padding:22px}.card-foot{padding:0 20px 14px;display:flex;justify-content:space-between;align-items:center;color:var(--c,var(--kids));font-size:.78rem;font-weight:800}.btn{border:0;border-radius:17px;padding:12px 20px;background:var(--c,var(--kids));color:#fff;font-weight:900;box-shadow:0 10px 22px -12px var(--c,var(--kids));cursor:pointer}.btn.ghost{background:#fff;color:var(--c);border:2px solid var(--c);box-shadow:none}.btn:disabled{opacity:.4;cursor:not-allowed}.field{width:100%;padding:11px 13px;border-radius:14px;border:2px solid #d8ded3;background:#fff;color:var(--ink);font:inherit;font-weight:700}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.choice{background:#fff;border:3px solid var(--c);border-radius:20px;padding:17px 10px;text-align:center;color:var(--c);cursor:pointer}.choice.selected{box-shadow:0 0 0 4px #fff,0 0 0 8px var(--c)}.choice .sym{width:64px;height:64px;margin:0 auto 8px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-size:2rem;font-weight:900}.choice .lab{font-size:1.25rem;font-weight:900}.choice .desc{font-size:.76rem;color:#69757b;margin-top:4px}.player{display:flex;gap:10px;align-items:center}.dot{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:900;flex:0 0 36px}.reveal{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.reveal .panel{padding:14px}.thoughts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.thought{border:3px solid var(--c);border-radius:20px;padding:16px;background:var(--bg);cursor:pointer;text-align:left;color:var(--ink)}.thought.selected{box-shadow:0 0 0 3px #fff,0 0 0 7px var(--c)}.thought .tag{font-weight:900;color:var(--c);display:block;margin-bottom:8px}.note{border-left:4px solid var(--c,var(--kids));padding:10px 12px;background:rgba(255,255,255,.72);border-radius:10px}.badge{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;color:#fff;font-weight:900}.topbar{width:min(900px,100%);margin:0 auto 18px;display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--petrol);font-weight:900}.credits{padding:14px 16px;border:1px solid rgba(22,76,89,.2);border-radius:14px;background:rgba(255,255,255,.62);text-align:left;font-size:.76rem;line-height:1.4}.credits p{margin:.25rem 0}.credits a{color:var(--petrol)}.change{border:3px solid var(--c);border-radius:18px;background:#fff;padding:14px}.arrow{font-size:1.4rem;color:#999}.summary{border-left:5px solid var(--kids);padding:12px 14px;background:#fff;border-radius:10px;text-align:left}.circle-logo{display:inline-block}.print-credit{display:none}
@media(max-width:650px){.grid3,.reveal{grid-template-columns:1fr}.grid2,.thoughts{grid-template-columns:1fr}.topbar{align-items:flex-start;flex-direction:column}.card-body{padding:18px}.app{padding:16px 10px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{body{background:#fff}.app{padding:0}.topbar,.no-print{display:none!important}.panel,.card{box-shadow:none}.print-credit{display:block;font-size:9px;text-align:center;margin-top:14px;color:#666}}
.opt{display:flex;gap:10px;align-items:flex-start;font-size:.9rem;line-height:1.35;cursor:pointer;text-align:left}.opt input{color-scheme:light;accent-color:#1E8A3C;width:20px;height:20px;flex:0 0 20px;margin-top:2px}textarea.field{resize:vertical}
.deckcol{display:grid;gap:10px;align-content:start}.thought.deck{width:100%;min-height:170px;display:flex;flex-direction:column;gap:6px;font-size:1.1rem;font-weight:800;box-shadow:5px 5px 0 -1px #fff,5px 5px 0 2px var(--c),10px 10px 0 -1px #fff,10px 10px 0 2px var(--c);margin-bottom:10px}.thought.deck.selected{box-shadow:0 0 0 3px #fff,0 0 0 7px var(--c)}.thought.deck .tag{display:flex;justify-content:space-between;margin:0}.thought.deck .hint{margin-top:auto;font-size:.76rem;font-weight:400;color:#69757b}.thought.deck.turn{animation:turn .2s ease-out}@keyframes turn{from{transform:rotateY(80deg);opacity:.3}to{transform:none;opacity:1}}
</style>
</head><body><main id="app" class="app" aria-live="polite"></main>
<script>
"use strict";
const SITUAZIONI=[{"n":1,"titolo":"L'assistente vocale","testo":"La maestra chiede all'assistente vocale di rispondere a una domanda di scienze. La risposta è giusta ma un po' difficile da capire.","dc":["DC1","DC5"]},{"n":2,"titolo":"Il disegno del concorso","testo":"Un compagno partecipa al concorso di disegno della scuola con un'immagine creata da un'app di IA. Non lo dice a nessuno.","dc":["DC3"]},{"n":3,"titolo":"La storia della classe","testo":"La maestra usa l'IA per creare una storia ambientata nella nostra classe, con i nostri nomi. È divertente, ma è vera letteratura?","dc":["DC3"]},{"n":4,"titolo":"I compiti facili","testo":"Un amico mi dice che c'è un'app che fa i compiti al posto tuo. Basta fare una foto. Che faccio?","dc":["DC5"]},{"n":5,"titolo":"La traduzione","testo":"In classe è arrivata una bambina che non parla italiano. La maestra usa l'IA per tradurre le parole e aiutarla.","dc":["DC2","DC4"]},{"n":6,"titolo":"I video consigliati","testo":"L'app mi propone sempre video simili a quelli che ho già guardato. Ne guardo uno dietro l'altro senza fermarmi. Chi sta scegliendo: io o l'IA?","dc":["DC4","DC5"]},{"n":7,"titolo":"La ricerca copiata","testo":"Per la ricerca sugli animali copio tutto quello che mi dice l'IA. Non leggo niente sul libro. È giusto?","dc":["DC1","DC3"]},{"n":8,"titolo":"La canzone","testo":"Per lo spettacolo di fine anno usiamo l'IA per scrivere le parole della canzone. La cantiamo noi però!","dc":["DC3"]},{"n":9,"titolo":"La foto del compagno","testo":"Un compagno usa un'app per mettere la faccia di un altro compagno su un personaggio buffo. Poi manda l'immagine a tutti. L'altro non lo sapeva.","dc":["DC2","DC4"]},{"n":10,"titolo":"Il quiz della maestra","testo":"La maestra usa l'IA per preparare un quiz divertente. Scopriamo che due risposte sono sbagliate!","dc":["DC1"]},{"n":11,"titolo":"Le parole difficili","testo":"Non capisco una parola del libro. Chiedo all'IA di spiegarmela con parole semplici. Adesso capisco!","dc":["DC1","DC5"]},{"n":12,"titolo":"Il personaggio del videogioco","testo":"Nel mio videogioco c'è un personaggio con cui posso chattare. È divertente, ma a volte dice cose strane.","dc":["DC4"]},{"n":13,"titolo":"La lettera","testo":"Devo scrivere una lettera alla nonna. Chiedo all'IA di scriverla per me. Ma le parole non sono le mie...","dc":["DC2","DC3"]},{"n":14,"titolo":"Il video di scienze","testo":"La maestra ci fa vedere un video fatto dall'IA che spiega il corpo umano. È bellissimo, ma una cosa è spiegata in modo impreciso.","dc":["DC1"]},{"n":15,"titolo":"La voce della maestra","testo":"Un compagno usa un'app per imitare la voce della maestra e crea un audio falso che fa ridere tutti. La maestra non è contenta.","dc":["DC2","DC4"]},{"n":16,"titolo":"I libri o l'IA?","testo":"La maestra ci chiede di cercare informazioni sui dinosauri. Metà classe usa i libri, metà usa l'IA. Chi trova le cose più giuste?","dc":["DC1"]},{"n":17,"titolo":"Il segreto","testo":"Racconto i miei segreti a un chatbot perché mi ascolta sempre. Ma dove finiscono le mie parole?","dc":["DC4"]},{"n":18,"titolo":"Il compito perfetto","testo":"Faccio fare il compito di matematica all'IA. È tutto giusto. Ma io non ho capito niente.","dc":["DC5"]},{"n":19,"titolo":"L'immagine del pianeta","testo":"Per scienze creo un'immagine con l'IA che mostra come sarà la Terra tra 100 anni. Sembra una foto vera.","dc":["DC1","DC3"]},{"n":20,"titolo":"La maestra e l'IA","testo":"La maestra usa l'IA per preparare le lezioni. Ci dice sempre: «L'ho controllato io prima di usarlo con voi».","dc":["DC1","DC5"]},{"n":21,"titolo":"Il regalo per la mamma","testo":"Devo scrivere una poesia per la festa della mamma. Chiedo all'IA di scriverla. È bella, ma non l'ho scritta io. La mamma lo scopre.","dc":["DC3"]},{"n":22,"titolo":"La caccia al tesoro","testo":"Per un gioco in giardino la maestra usa l'IA per creare una caccia al tesoro con indovinelli. Divertente! Ma un indovinello non ha soluzione.","dc":["DC5"]},{"n":23,"titolo":"Il compagno che copia","testo":"Un compagno usa sempre l'IA per fare i compiti. Prende bei voti, ma alle verifiche non sa niente.","dc":["DC5"]},{"n":24,"titolo":"L'animale inventato","testo":"Confrontiamo le risposte dell'IA con l'enciclopedia. Scopriamo che l'IA ha inventato un animale che non esiste!","dc":["DC1"]},{"n":25,"titolo":"Il diario segreto","testo":"Scrivo il mio diario su un'app con IA che corregge gli errori e rende tutto più bello. Ma le mie parole cambiano...","dc":["DC3","DC4"]},{"n":26,"titolo":"Chi ha fatto il disegno?","testo":"La maestra appende i disegni di tutti. Uno è fatto con l'IA e si vede subito: è troppo perfetto. Ne parliamo insieme.","dc":["DC3"]}];
const VERDI=["L'IA mi aiuta a capire le cose difficili","Con l'IA imparo cose nuove","L'IA mi dà delle idee","L'IA aiuta chi ha difficoltà","L'IA mi fa risparmiare tempo","L'IA può tradurre le lingue","Con l'IA posso esplorare il mondo","L'IA mi aiuta quando sono bloccato","L'IA può rendere le lezioni più divertenti"];
const ROSSE=["L'IA può sbagliare!","Se copio dall'IA non imparo","L'IA non è un amico vero","L'IA non sa chi sono io","L'IA usa tanta energia","I miei segreti non sono al sicuro","Passo troppo tempo davanti allo schermo","Se l'IA fa tutto, io non mi alleno a pensare","L'IA non prova emozioni vere"];
const OPINIONI=[{"id":"SI","label":"SÌ!","desc":"Sono d'accordo!","col":"#1E9E6A","sym":"✓"},{"id":"NO","label":"NO!","desc":"Non sono d'accordo!","col":"#D64545","sym":"×"},{"id":"BOH","label":"BOH","desc":"Non lo so... ma dico cosa mi manca!","col":"#2E86DE","sym":"?"},{"id":"DIPENDE","label":"DIPENDE","desc":"Dipende! E spiego da cosa.","col":"#E8912D","sym":"~"}];
const COLORS=['var(--kids)','var(--orange)','var(--purple)','var(--blue)','var(--pink)','var(--green)'];
const DELICATE=[9,15,17];
const app=document.getElementById('app');
let state={fase:'setup',players:['','',''],rounds:3,deck:[],round:0,sit:null,hands:{},initial:{},final:{},opPos:0,opStage:'pass',speakPos:0,speakStage:'pass',playSel:null,changePos:0,changeStage:'pass',history:[],bianca:{titolo:'',testo:''}};
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function shuffle(a){const x=[...a];for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]];}return x}
function logo(size=66){return `<svg class="circle-logo" width="${size}" height="${size}" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="35" fill="none" stroke="var(--petrol)" stroke-width="6"/>${[[50,15,'var(--blue)'],[83,39,'var(--orange)'],[70,79,'var(--kids)'],[30,79,'var(--red)'],[17,39,'var(--purple)']].map(d=>`<circle cx="${d[0]}" cy="${d[1]}" r="10" fill="#fff"/><circle cx="${d[0]}" cy="${d[1]}" r="7" fill="${d[2]}"/>`).join('')}</svg>`}
function btn(label,color='var(--kids)',attrs=''){return `<button class="btn" style="--c:${color}" ${attrs}>${label}</button>`}
function credits(){return `<aside class="credits"><b>Attribuzione e licenza</b><p><b>AI Game Circle · Kids</b> · Emilia Sera · <a href="https://www.edugem.it" target="_blank" rel="noopener">www.edugem.it</a></p><p>© 2026 Emilia Sera · CC BY-NC-SA 4.0</p><p>Attribuzione consigliata: <i>“AI Game Circle · Kids — Emilia Sera, www.edugem.it — CC BY-NC-SA 4.0”</i>.</p></aside>`}
function shell(content,top=true){let head='';if(top&&state.fase!=='setup'&&state.fase!=='summary'){head=`<div class="topbar"><div class="row">${logo(30)}<span>SITUAZIONE ${state.round+1}/${state.rounds}</span></div><span>👩‍🏫 Moderatore: docente</span></div>`}app.innerHTML=head+content;window.scrollTo(0,0)}
function card(color,head,body,foot=''){return `<section class="card" style="--c:${color}"><div class="card-head">${head}</div><div class="card-body">${body}</div>${foot?`<div class="card-foot"><span>${foot}</span>${logo(24)}</div>`:''}</section>`}
function opBy(id){return OPINIONI.find(o=>o.id===id)}
function opHtml(id){const o=opBy(id);return `<span class="badge" style="background:${o.col}">${esc(o.sym)} ${esc(o.label)}</span>`}
function setPhase(f){state.fase=f;render()}
function activePlayers(){return state.players.map((_,i)=>i)}
function playerInputs(){return state.players.map((n,i)=>`<div class="player"><span class="dot" style="background:${COLORS[i]}">${i+1}</span><input class="field pname" data-i="${i}" maxlength="18" placeholder="Nome bambino ${i+1}" value="${esc(n)}">${state.players.length>3?`<button class="btn ghost" style="--c:${COLORS[i]};padding:8px 11px" data-del="${i}" aria-label="Rimuovi ${esc(n||'bambino')}">−</button>`:''}</div>`).join('')}
function renderSetup(){shell(`<div class="wrap stack"><header class="center stack" style="gap:8px;padding-top:10px">${logo(94)}<h1 class="display title">AI GAME <span style="color:var(--kids)">CIRCLE</span></h1><div class="subtitle">KIDS · 9-11 ANNI</div><p class="muted">Scuola primaria · classi IV-V · 3-6 bambini · docente Moderatore.</p><p class="claim" style="color:var(--petrol)">Non si vince. Si esplora.</p></header><section class="panel stack"><h2 class="display" style="color:var(--kids);margin:0">👧👦 Chi c'è nel cerchio?</h2>${playerInputs()}${state.players.length<6?btn('＋ Aggiungi un bambino','var(--kids)','id=add') : ''}<div class="row between"><b>Situazioni da giocare</b><select id="rounds" class="field" style="width:120px"><option value="2" ${state.rounds===2?'selected':''}>2</option><option value="3" ${state.rounds===3?'selected':''}>3</option><option value="4" ${state.rounds===4?'selected':''}>4</option></select></div></section><section class="panel stack" style="gap:10px"><h2 class="display" style="color:var(--kids);margin:0">✏️ Carta bianca <span class="tiny muted" style="font-weight:400">(facoltativa)</span></h2><p class="small muted" style="margin:0">Il docente può scrivere una situazione nuova: plausibile, anonima e neutra. Se compili il testo, sarà la prima situazione del cerchio.</p><input class="field" id="bTit" maxlength="40" placeholder="Titolo della situazione" value="${esc(state.bianca.titolo)}"><textarea class="field" id="bTxt" rows="3" maxlength="260" placeholder="Scrivi qui una nuova situazione">${esc(state.bianca.testo)}</textarea></section><section class="panel small" style="border:3px solid var(--kids)"><b style="color:var(--kidsd)">COME SI GIOCA</b><p>1 · Il docente legge una SITUAZIONE.</p><p>2 · Tutti scelgono in segreto SÌ / NO / BOH / DIPENDE.</p><p>3 · Si scopre insieme.</p><p>4 · Ognuno spiega e può scegliere una carta PENSIERO girando i mazzi.</p><p>5 · Alla fine si può confermare o cambiare idea.</p><b>Niente punti e niente timer.</b></section><div class="center">${btn('🎪 SI PARTE!','var(--orange)','id=start disabled')}</div>${credits()}</div>`,false);document.querySelectorAll('.pname').forEach(e=>e.oninput=ev=>{state.players[+e.dataset.i]=ev.target.value;document.getElementById('start').disabled=state.players.some(x=>!x.trim())});document.querySelectorAll('[data-del]').forEach(e=>e.onclick=()=>{state.players.splice(+e.dataset.del,1);render()});if(document.getElementById('add'))document.getElementById('add').onclick=()=>{state.players.push('');render()};document.getElementById('rounds').onchange=e=>state.rounds=+e.target.value;document.getElementById('bTit').oninput=e=>{state.bianca.titolo=e.target.value};document.getElementById('bTxt').oninput=e=>{state.bianca.testo=e.target.value};const start=document.getElementById('start');start.disabled=state.players.some(x=>!x.trim());start.onclick=startGame}
function startGame(){state.players=state.players.map(x=>x.trim());state.deck=shuffle(SITUAZIONI).slice(0,state.rounds);if(state.bianca.testo.trim())state.deck[0]={n:0,titolo:state.bianca.titolo.trim()||'Carta bianca',testo:state.bianca.testo.trim(),dc:[],custom:true};state.round=0;state.history=[];prepareRound()}
function prepareRound(){state.sit=state.deck[state.round];const vg=shuffle(VERDI),rr=shuffle(ROSSE);state.hands={};state.players.forEach((_,i)=>state.hands[i]={green:vg[i],red:rr[i]});state.initial={};state.final={};state.opPos=0;state.opStage='pass';state.speakPos=0;state.speakStage='pass';state.playSel=null;state.changePos=0;state.changeStage='pass';state.fase='situation';render()}
function renderSituation(){shell(`<div class="wrap stack"><div class="note" style="--c:var(--kids)"><b>👩‍🏫 Docente Moderatore:</b> leggi la storia con tono neutro. Chiarisci solo eventuali parole non comprese.</div>${DELICATE.includes(state.sit.n)?`<div class="note" style="--c:var(--red)"><b>⚠ Situazione delicata.</b> Evita richieste di confessioni personali, proteggi la riservatezza e riporta il confronto sul caso immaginario.</div>`:''}${card('var(--kids)','📖 SITUAZIONE',`<h2 class="display" style="color:var(--kidsd);margin-top:0">${esc(state.sit.titolo)}</h2><p style="font-size:1.2rem;line-height:1.55">${esc(state.sit.testo)}</p>`,state.sit.custom?'Carta bianca':`N. ${state.sit.n}`)}<div class="center">${btn('Letta! Ora si sceglie in segreto ➜','var(--orange)','id=opinions')}</div></div>`);document.getElementById('opinions').onclick=()=>setPhase('opinions')}
function renderOpinions(){const act=activePlayers();if(state.opPos>=act.length){state.fase='reveal';render();return}const pi=act[state.opPos],name=state.players[pi];if(state.opStage==='pass'){shell(`<div class="wrap center stack" style="max-width:520px;padding-top:28px"><div style="font-size:4rem">🙈</div><h2 class="display">Passa il dispositivo a <span style="color:${COLORS[pi]}">${esc(name)}</span></h2><p class="muted">Gli altri non guardano. La scelta resta segreta fino allo SCOPRI.</p>${btn(`Sono ${esc(name)}, continua`,COLORS[pi],'id=ready')}</div>`);document.getElementById('ready').onclick=()=>{state.opStage='choose';render()};return}const cur=state.initial[pi];shell(`<div class="wrap center stack"><h2 class="display" style="color:${COLORS[pi]}">${esc(name)}, cosa ne pensi?</h2><div class="grid2">${OPINIONI.map(o=>`<button class="choice ${cur===o.id?'selected':''}" style="--c:${o.col}" data-op="${o.id}"><div class="sym">${esc(o.sym)}</div><div class="lab">${esc(o.label)}</div><div class="desc">${esc(o.desc)}</div></button>`).join('')}</div>${btn('Conferma e nascondi',COLORS[pi],`id=confirm ${cur?'':'disabled'}`)}</div>`);document.querySelectorAll('[data-op]').forEach(e=>e.onclick=()=>{state.initial[pi]=e.dataset.op;render()});document.getElementById('confirm').onclick=()=>{state.opPos++;state.opStage='pass';render()}}
function renderReveal(){shell(`<div class="wide center stack"><h2 class="display">✨ 3… 2… 1… SCOPRI!</h2><p class="muted">Guardate le differenze. Non c'è una maggioranza da vincere.</p><div class="reveal">${activePlayers().map(pi=>`<div class="panel"><b style="color:${COLORS[pi]}">${esc(state.players[pi])}</b><div style="margin-top:10px">${opHtml(state.initial[pi])}</div></div>`).join('')}</div><div class="note small" style="--c:var(--kids)"><b>👩‍🏫 Docente:</b> avvia il giro di parola. Chi ha scelto BOH dice cosa gli manca; chi ha scelto DIPENDE spiega da cosa dipende.</div>${btn('Inizia il giro di parola ➜','var(--kids)','id=speak')}</div>`);document.getElementById('speak').onclick=()=>setPhase('speak')}
function renderSpeak(){const act=activePlayers();if(state.speakPos>=act.length){state.fase='change';state.changePos=0;state.changeStage='pass';render();return}const pi=act[state.speakPos],name=state.players[pi],hand=state.hands[pi],o=opBy(state.initial[pi]);if(state.speakStage==='pass'){shell(`<div class="wrap center stack" style="max-width:520px;padding-top:24px"><div style="font-size:3.5rem">💭</div><h2 class="display">Tocca a <span style="color:${COLORS[pi]}">${esc(name)}</span></h2><p class="muted">La tua opinione è ${opHtml(o.id)}. Puoi girare i mazzi delle carte PENSIERO e sceglierne una, oppure parlare con parole tue.</p>${btn('Mostrami i mazzi',COLORS[pi],'id=show')}</div>`);document.getElementById('show').onclick=()=>{state.speakStage='choose';state.playSel=null;state.gOrd=shuffle(VERDI.map((_,i)=>i));state.rOrd=shuffle(ROSSE.map((_,i)=>i));state.gPos=0;state.rPos=0;render()};return}if(state.speakStage==='choose'){const deckBtn=(k,col,bg,lab,arr)=>`<div class="deckcol"><button class="thought deck" id="deck${k}" style="--c:${col};--bg:${bg}" aria-label="Gira il mazzo ${lab}"><span class="tag"><span>${k==='G'?'💚':'❤️'} ${lab}</span><span id="cnt${k}"></span></span><span id="txt${k}" aria-live="polite"></span><span class="hint">👆 Tocca la carta per girare il mazzo</span></button><button class="btn" style="--c:${col}" id="pick${k}">Scelgo questa carta</button></div>`;shell(`<div class="wrap stack"><div class="center"><h2 class="display">${esc(name)} · scegli un aiuto</h2><p class="muted small">Tocca un mazzo per girare le carte: ci sono tutte le 9 verdi e tutte le 9 rosse. Quando trovi quella che ti aiuta, fermati e sceglila. Non devi per forza usare una carta.</p></div><div class="thoughts">${deckBtn('G','var(--green)','#EFF9F3','MI PIACE')}${deckBtn('R','var(--red)','#FDF1F1','ATTENZIONE')}<button class="thought" id="pickN" style="--c:var(--kids);--bg:#F3FAF1;grid-column:1/-1"><span class="tag" style="color:var(--kidsd)">🗣 PAROLE MIE</span>Spiego senza usare una carta.</button></div><div class="center">${btn('Conferma e parla ➜',COLORS[pi],'id=public disabled')}</div></div>`);const $=id=>document.getElementById(id);const sync=()=>{$('txtG').textContent=VERDI[state.gOrd[state.gPos]];$('cntG').textContent=(state.gPos+1)+'/'+VERDI.length;$('txtR').textContent=ROSSE[state.rOrd[state.rPos]];$('cntR').textContent=(state.rPos+1)+'/'+ROSSE.length;$('deckG').classList.toggle('selected',state.playSel==='green');$('deckR').classList.toggle('selected',state.playSel==='red');$('pickN').classList.toggle('selected',state.playSel==='none');$('pickG').textContent=state.playSel==='green'?'✓ Carta scelta':'Scelgo questa carta';$('pickR').textContent=state.playSel==='red'?'✓ Carta scelta':'Scelgo questa carta';$('public').disabled=!state.playSel};const turn=(k,sel)=>{if(k==='G')state.gPos=(state.gPos+1)%VERDI.length;else state.rPos=(state.rPos+1)%ROSSE.length;if(state.playSel===sel)state.playSel=null;const d=$('deck'+k);d.classList.remove('turn');void d.offsetWidth;d.classList.add('turn');sync()};$('deckG').onclick=()=>turn('G','green');$('deckR').onclick=()=>turn('R','red');$('pickG').onclick=()=>{state.playSel='green';sync()};$('pickR').onclick=()=>{state.playSel='red';sync()};$('pickN').onclick=()=>{state.playSel='none';sync()};$('public').onclick=()=>{state.speakStage='public';render()};sync();return}let publicCard;if(state.playSel==='green')publicCard=card('var(--green)','💚 MI PIACE',`<p style="font-size:1.15rem;font-weight:800">${esc(VERDI[state.gOrd[state.gPos]])}</p>`);else if(state.playSel==='red')publicCard=card('var(--red)','❤️ ATTENZIONE',`<p style="font-size:1.15rem;font-weight:800">${esc(ROSSE[state.rOrd[state.rPos]])}</p>`);else publicCard=card('var(--kids)','🗣 PAROLE MIE','<p style="font-size:1.15rem;font-weight:800">Spiega con una ragione, un esempio o una condizione.</p>');let prompt=o.id==='BOH'?'Di’ che cosa ti manca per decidere.':o.id==='DIPENDE'?'Spiega da che cosa dipende.':'Spiega perché hai scelto questa opinione.';shell(`<div class="wrap stack"><div class="center"><h2 class="display">Giro di parola · ${esc(name)}</h2><p>Opinione: ${opHtml(o.id)}</p></div>${publicCard}<div class="note" style="--c:${COLORS[pi]}"><b>${esc(prompt)}</b> Gli altri ascoltano senza interrompere.</div><div class="center">${btn(state.speakPos<act.length-1?'Passa al prossimo ➜':'Giro completato ➜',COLORS[pi],'id=next')}</div></div>`);document.getElementById('next').onclick=()=>{state.speakPos++;state.speakStage='pass';state.playSel=null;render()}}
function renderChange(){const act=activePlayers();if(state.changePos>=act.length){state.fase='changeReveal';render();return}const pi=act[state.changePos],name=state.players[pi],a=opBy(state.initial[pi]);if(state.changeStage==='pass'){shell(`<div class="wrap center stack" style="max-width:520px;padding-top:28px"><div style="font-size:4rem">🔄</div><h2 class="display">Passa il dispositivo a <span style="color:${COLORS[pi]}">${esc(name)}</span></h2><p class="muted">Dopo aver ascoltato tutti puoi confermare o cambiare idea.</p>${btn(`Sono ${esc(name)}, continua`,COLORS[pi],'id=readyChange')}</div>`);document.getElementById('readyChange').onclick=()=>{state.changeStage='choose';if(!state.final[pi])state.final[pi]=state.initial[pi];render()};return}const cur=state.final[pi];shell(`<div class="wrap center stack"><h2 class="display">Vuoi cambiare idea?</h2><p class="small muted">Prima avevi scelto ${opHtml(a.id)}. Cambiare non è obbligatorio.</p><div class="grid2">${OPINIONI.map(o=>`<button class="choice ${cur===o.id?'selected':''}" style="--c:${o.col}" data-final="${o.id}"><div class="sym">${esc(o.sym)}</div><div class="lab">${esc(o.label)}</div><div class="desc">${esc(o.desc)}</div></button>`).join('')}</div>${btn('Conferma',COLORS[pi],'id=confirmChange')}</div>`);document.querySelectorAll('[data-final]').forEach(e=>e.onclick=()=>{state.final[pi]=e.dataset.final;render()});document.getElementById('confirmChange').onclick=()=>{state.changePos++;state.changeStage='pass';render()}}
function finishRound(){const changes=activePlayers().filter(pi=>state.initial[pi]!==state.final[pi]);state.history.push({sit:state.sit,changes:changes.length});if(state.round<state.rounds-1){state.round++;prepareRound()}else{state.fase='summary';render()}}
function renderChangeReveal(){shell(`<div class="wide center stack"><h2 class="display">Qualcuno ha cambiato idea?</h2><div class="reveal">${activePlayers().map(pi=>{const a=opBy(state.initial[pi]),b=opBy(state.final[pi]),changed=a.id!==b.id;return `<div class="change" style="--c:${changed?'var(--kids)':'var(--petrol)'}"><b style="color:${COLORS[pi]}">${esc(state.players[pi])}</b><div class="row" style="justify-content:center;margin-top:10px">${opHtml(a.id)}<span class="arrow">→</span>${opHtml(b.id)}</div><div class="tiny muted" style="margin-top:8px">${changed?'Ha cambiato opinione':'Ha confermato la sua opinione'}</div></div>`}).join('')}</div><div class="note small" style="--c:var(--kids)">Chi ha cambiato spiega <b>che cosa ha ascoltato</b> che gli ha fatto pensare. Anche chi conferma può dire quale idea lo ha convinto di più.</div>${btn(state.round<state.rounds-1?'Nuova situazione ➜':'Vai alla restituzione finale ➜','var(--orange)','id=finish')}</div>`);document.getElementById('finish').onclick=finishRound}
function renderSummary(){const total=state.history.reduce((s,x)=>s+x.changes,0);shell(`<div class="wrap center stack" style="padding-top:18px">${logo(82)}<h2 class="display">Restituzione finale</h2><p class="claim muted">AI Game Circle non si vince. Si esplora.</p><div class="panel"><div class="display" style="font-size:2.5rem;color:var(--kidsd)">${total}</div><div>cambi di opinione emersi nel cerchio</div><div class="tiny muted">Non è un punteggio. È solo una traccia dell'ascolto.</div></div><div class="stack">${state.history.map((h,i)=>`<div class="summary"><b>${i+1}. ${esc(h.sit.titolo)}</b><br><span class="tiny muted">Cambi di opinione: ${h.changes}</span></div>`).join('')}</div><section class="panel" style="text-align:left"><h3 class="display" style="color:var(--petrol);margin-top:0">Tre domande per chiudere</h3><p>1. Quale idea ti ha fatto pensare di più?</p><p>2. C’è stato un BOH o un DIPENDE interessante? Che cosa mancava o da cosa dipendeva?</p><p>3. Qual è una cosa da ricordare quando usiamo l’IA?</p></section>${btn('↺ Nuova partita','var(--orange)','id=restart')}${credits()}<div class="print-credit">AI Game Circle · Kids — © 2026 Emilia Sera · www.edugem.it · CC BY-NC-SA 4.0</div></div>`,false);document.getElementById('restart').onclick=()=>{state={fase:'setup',players:['','',''],rounds:3,deck:[],round:0,sit:null,hands:{},initial:{},final:{},opPos:0,opStage:'pass',speakPos:0,speakStage:'pass',playSel:null,changePos:0,changeStage:'pass',history:[],bianca:{titolo:'',testo:''}};render()}}
function render(){switch(state.fase){case'setup':renderSetup();break;case'situation':renderSituation();break;case'opinions':renderOpinions();break;case'reveal':renderReveal();break;case'speak':renderSpeak();break;case'change':renderChange();break;case'changeReveal':renderChangeReveal();break;case'summary':renderSummary();break}}
render();
</script></body></html>
