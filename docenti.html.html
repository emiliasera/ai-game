<title>AI Game Debate · DOCENTI</title>
<style>
:root{
  --navy:#241E4E; --navy-deep:#181438; --paper:#FDFDFB; --ink:#22243A;
  --sit:#1E56A0; --sit-dark:#143E7A; --pro:#1E7A34; --pro-dark:#135A24;
  --contro:#A31414; --contro-dark:#7A0D0D; --oro:#D9A621; --oro-dark:#9C7411;
  --si:#1E8A3C; --no:#C81E1E; --sima:#E86A10; --nonso:#2E86DE;
  --blue:#2E75B6; --red:#E23B3B; --green:#3FA84C;
}
*{box-sizing:border-box} html{min-height:100%;background:var(--navy-deep)}
body{margin:0;min-height:100vh;color:var(--paper);font-family:"Atkinson Hyperlegible",Arial,Verdana,sans-serif;background:
 radial-gradient(circle at 15% 20%,rgba(46,117,182,.18),transparent 40%),
 radial-gradient(circle at 85% 75%,rgba(226,59,59,.12),transparent 45%),
 radial-gradient(circle at 60% 10%,rgba(63,168,76,.10),transparent 35%),
 linear-gradient(160deg,var(--navy),var(--navy-deep) 70%);}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.35;background-image:radial-gradient(rgba(255,255,255,.10) 1.2px,transparent 1.2px);background-size:34px 34px}
button,input,textarea,select{font:inherit} button{cursor:pointer} button:disabled{opacity:.42;cursor:not-allowed}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #fff;outline-offset:3px}
.app{position:relative;z-index:1;min-height:100vh;padding:24px 16px}.wrap{width:min(760px,100%);margin:0 auto}.wide{width:min(980px,100%);margin:0 auto}
.display{font-family:Arial,Verdana,sans-serif;font-weight:900;letter-spacing:.025em}.center{text-align:center}.muted{opacity:.72}.small{font-size:.9rem}.tiny{font-size:.76rem}.spacer{height:8px}
.title{font-size:clamp(2.2rem,7vw,4rem);line-height:.98;margin:.3rem 0}.subtitle{letter-spacing:.24em;font-size:.82rem;font-weight:800}.claim{font-style:italic}
.logo{display:inline-block;vertical-align:middle}.topbar{display:flex;gap:12px;align-items:center;justify-content:space-between;margin:0 auto 20px;width:min(880px,100%);font-size:.86rem}.scores{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px}.score{padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.08)}
.panel,.card{background:var(--paper);color:var(--ink);border-radius:20px;box-shadow:0 22px 44px -18px rgba(0,0,0,.65);position:relative;overflow:hidden}.panel{padding:22px}.card{border:3px solid var(--c,var(--sit))}.card-head{background:linear-gradient(90deg,var(--c),var(--c) 72%,transparent);color:#fff;font-weight:900;letter-spacing:.05em;padding:10px 16px;text-transform:uppercase;border-bottom-right-radius:18px}.card-body{padding:22px}.card-foot{padding:0 20px 14px;display:flex;align-items:center;justify-content:space-between;color:var(--c);font-size:.78rem;font-weight:800}.card::after{content:"";position:absolute;right:10px;top:8px;width:70px;height:45px;opacity:.2;background-image:radial-gradient(var(--c) 1.6px,transparent 1.6px);background-size:10px 10px;pointer-events:none}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.stack{display:grid;gap:16px}.row{display:flex;align-items:center;gap:12px}.between{justify-content:space-between}
.btn{border:0;border-radius:14px;padding:12px 20px;background:var(--c,var(--sit));color:#fff;font-weight:900;letter-spacing:.025em;box-shadow:0 10px 24px -10px var(--c,var(--sit))}.btn.ghost{background:rgba(255,255,255,.07);border:2px solid var(--c,var(--sit));box-shadow:none}.btn.slim{padding:9px 14px;font-size:.9rem}.btn.widebtn{width:100%}
.field{width:100%;border:2px solid #cdd4df;border-radius:12px;padding:11px 13px;color:var(--ink);background:#fff}.namebadge{width:34px;height:34px;flex:0 0 34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:900}.role{border:2px solid var(--c);padding:14px 10px;border-radius:16px;background:rgba(255,255,255,.06);text-align:center}.role .ico{font-size:1.7rem}.role .lab{font-size:.74rem;font-weight:900;letter-spacing:.08em;color:var(--c)}.role .nm{font-weight:800;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note{border-left:4px solid var(--c,var(--sit));padding:10px 12px;background:rgba(255,255,255,.07);border-radius:8px}.safe{border-left-color:#f2c94c}.safe strong{color:#ffe28a}
.choice{border:3px solid var(--c);background:var(--paper);border-radius:18px;padding:18px 10px;color:var(--c);text-align:center}.choice.selected{box-shadow:0 0 0 4px rgba(255,255,255,.9),0 0 0 8px var(--c)}.choice .ico{font-size:2.2rem}.choice .lab{font-size:1.25rem;font-weight:900}.choice .desc{font-size:.78rem;color:#667085;margin-top:5px}
.deck{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;max-height:50vh;overflow:auto;padding:4px}.arg{border:2.5px solid var(--c);background:var(--paper);color:var(--ink);border-radius:16px;padding:12px;text-align:left;line-height:1.25}.arg.selected{box-shadow:0 0 0 3px #fff,0 0 0 6px var(--c)}.arg.jolly{border-style:dashed;background:#fff8e6}.arg .num{font-weight:900;color:var(--c);margin-right:7px}
.timer{display:grid;justify-items:center;gap:12px}.ring{--pct:100;--tc:#fff;width:136px;height:136px;border-radius:50%;padding:7px;background:conic-gradient(var(--tc) calc(var(--pct)*1%),rgba(255,255,255,.12) 0)}.ring-inner{height:100%;border-radius:50%;background:var(--navy-deep);display:grid;place-items:center;align-content:center}.seconds{font-size:2.6rem;font-weight:900}.timeropts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.timeropt{border:0;border-radius:999px;padding:6px 12px;color:#fff;font-weight:800;background:rgba(255,255,255,.1)}.timeropt.active{background:var(--tc)}
.reveal{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.summaryrow{display:flex;gap:16px;align-items:center}.points{font-size:2.2rem;color:var(--oro);font-weight:900;min-width:38px}.divider{height:1px;background:#d9dde5;margin:12px 0}.question{display:grid;gap:6px}.print-only{display:none}.no-print{}
.print-credit{display:none}

.profile{border:2px solid var(--c);border-radius:14px;background:#fff;color:var(--ink);padding:12px;text-align:left}.profile.active{box-shadow:0 0 0 3px var(--c)}.profile b{color:var(--c)}
.credits{margin-top:12px;padding:14px 16px;border:1px solid rgba(255,255,255,.18);border-radius:14px;background:rgba(255,255,255,.055);text-align:left}
.credits .credit-title{font-weight:900;letter-spacing:.05em;text-transform:uppercase;color:#ffe28a;font-size:.78rem;margin-bottom:6px}
.credits p{margin:.28rem 0;line-height:1.35}
.credits a{color:#fff;text-decoration:underline;text-underline-offset:2px}

@media(max-width:650px){.grid3{grid-template-columns:1fr}.grid2,.deck,.reveal{grid-template-columns:1fr}.topbar{align-items:flex-start;flex-direction:column}.scores{justify-content:flex-start}.card-body{padding:18px}.app{padding:18px 12px}.role{display:grid;grid-template-columns:auto 1fr;column-gap:10px;align-items:center;text-align:left}.role .ico{grid-row:1/3}.role .nm{margin:0}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
@media print{body{background:#fff!important;color:#000!important}body::before,.no-print,.topbar{display:none!important}.app{padding:0}.wrap,.wide{width:100%}.panel,.card{box-shadow:none;border:1px solid #bbb;break-inside:avoid}.print-only{display:block}.diary-player{page-break-inside:avoid;margin-bottom:16px}textarea{border:1px solid #999;min-height:80px}.muted{opacity:1;color:#444}.app::after{content:"AI Game Debate · DOCENTI — © 2026 Emilia Sera · www.edugem.it · CC BY-NC-SA 4.0";display:block;margin-top:18px;padding-top:8px;border-top:1px solid #bbb;font-size:10px;color:#555;text-align:center}}
.opt{display:flex;gap:10px;align-items:flex-start;font-size:.9rem;line-height:1.35;cursor:pointer;text-align:left}.opt input{color-scheme:light;accent-color:#1E8A3C;width:20px;height:20px;flex:0 0 20px;margin-top:2px}textarea.field{resize:vertical}
</style>

<script>
"use strict";
const SITUAZIONI = [{"n": 1, "dc": "DC1 + DC3", "titolo": "Preparare una ricerca", "testo": "Ho 10 anni. Con un compagno devo preparare una ricerca. Decidiamo di usare l'IA per trovare informazioni, generare immagini e migliorare la presentazione.", "norma": "DigCompEdu Area 3; DigComp 3.0 DC1 + DC3: ricerca, verifica e rielaborazione.", "livello": "Primaria"}, {"n": 2, "dc": "DC1", "titolo": "Ripassare per la verifica", "testo": "Ho 12 anni. Tra due settimane c'è la verifica di storia. Chiedo all'IA di farmi domande per ripassare e di creare una mappa concettuale.", "norma": "DigCompEdu Area 3; DigComp DC1 + DC5: uso dell’IA come supporto allo studio.", "livello": "Sec. I grado"}, {"n": 3, "dc": "DC1", "titolo": "Esercizio sbagliato", "testo": "Ho 9 anni. Faccio sempre qualche errore nei problemi. Oggi uso l'IA e copio la risposta. Alla correzione scopro che anche l'IA ha sbagliato.", "norma": "DigComp DC1: verifica dell’attendibilità delle risposte e consapevolezza dei limiti del sistema.", "livello": "Primaria"}, {"n": 4, "dc": "DC3", "titolo": "Il tema che non mi piace", "testo": "Ho 13 anni. Devo scrivere un testo argomentativo. Chiedo all'IA di scriverlo per me, poi lo presento come mio. La prof se ne accorge.", "norma": "DM 166/2025: uso critico e responsabile; DigComp DC3: autorialità e rielaborazione.", "livello": "Sec. I grado"}, {"n": 5, "dc": "DC3", "titolo": "L'illustrazione di arte", "testo": "Ho 11 anni. Per il laboratorio devo creare un'illustrazione. Uso l'IA per generare un'immagine e la presento come opera mia.", "norma": "Diritto d’autore e licenze; DigComp DC3; trasparenza sull’apporto dell’IA quando pertinente.", "livello": "Sec. I grado"}, {"n": 6, "dc": "DC5", "titolo": "Aiuto per i compiti", "testo": "Un alunno non riesce a risolvere un problema di matematica. Chiede all'IA di spiegarglielo passo passo. Capisce e risolve da solo.", "norma": "DigCompEdu Area 3; DigComp DC5: supporto alla risoluzione senza sostituzione dell’apprendimento.", "livello": "Generico"}, {"n": 7, "dc": "DC3", "titolo": "La storia personalizzata", "testo": "Sono una maestra di scuola dell'infanzia. Uso l'IA per creare una storia personalizzata con il nome di ogni bambino della classe. La preparo a casa e la leggo io in classe.", "norma": "GDPR: minimizzazione e protezione dei dati; DigCompEdu Area 2 - Risorse digitali.", "livello": "Infanzia"}, {"n": 8, "dc": "DC4", "titolo": "Il chatbot amico", "testo": "Sono una maestra di quarta. Un bambino mi racconta che ogni sera parla con un chatbot perché si sente solo. Lo trova più paziente dei genitori.", "norma": "DM 166/2025: centralità della persona e benessere; DigComp DC4.", "livello": "Primaria"}, {"n": 9, "dc": "DC2", "titolo": "La traduzione istantanea", "testo": "In classe c'è un compagno appena arrivato dall'Ucraina. La maestra usa l'IA per tradurre le consegne nella sua lingua.", "norma": "Inclusione linguistica; DigCompEdu Area 3; DigComp DC2.", "livello": "Primaria"}, {"n": 10, "dc": "DC3 + DC4", "titolo": "Schede semplificate", "testo": "Sono un insegnante di sostegno. Uso l'IA per creare schede per un alunno con DSA, adattando lessico e grafica. Non inserisco dati personali.", "norma": "Inclusione e personalizzazione; GDPR se si trattano dati personali; DigCompEdu Aree 2 e 5; DigComp DC3.", "livello": "Generico"}, {"n": 11, "dc": "DC1", "titolo": "La correzione automatica", "testo": "Sono un docente di italiano. Uso l'IA per correggere i temi e assegnare un voto automatico. Consegno i voti senza verificare se le valutazioni dell'IA sono corrette.", "norma": "AI Act, All. III 3(b): possibile alto rischio se il sistema è destinato a valutare risultati di apprendimento; supervisione umana; DigCompEdu Area 4.", "livello": "Generico"}, {"n": 12, "dc": "DC4 + DC3", "titolo": "Il video deepfake", "testo": "Ho 13 anni. Uso l'IA per creare un video in cui un personaggio storico parla come se fosse vivo. I compagni pensano sia vero.", "norma": "AI Act art. 50(4): trasparenza per deepfake; DigComp DC4 e media literacy.", "livello": "Sec. I grado"}, {"n": 13, "dc": "DC4", "titolo": "Il registro dei voti", "testo": "Sono docente in un istituto superiore. La scuola adotta un sistema IA che analizza i voti degli studenti e suggerisce attività di recupero. Le famiglie non sono state informate che i dati dei figli vengono elaborati da un sistema IA.", "norma": "AI Act, All. III 3(b): possibile alto rischio se la valutazione orienta il processo di apprendimento; GDPR: trasparenza e protezione dati.", "livello": "Sec. II grado"}, {"n": 14, "dc": "DC4", "titolo": "La voce clonata", "testo": "Ho 12 anni. Per scherzo uso un'app per clonare la voce di un compagno senza il suo consenso e gli faccio dire cose che non ha mai detto.", "norma": "Consenso, dignità e tutela della persona; AI Act art. 50 quando il contenuto rientra nella disciplina dei deepfake; DigComp DC4.", "livello": "Sec. I grado"}, {"n": 15, "dc": "DC1", "titolo": "Il riassunto perfetto", "testo": "Ho 10 anni. La maestra ci chiede di leggere un libro e fare il riassunto. Io copio il testo nell'IA e consegno.", "norma": "DM 166/2025: approccio critico; DigComp DC1 + DC3: comprensione e autorialità.", "livello": "Primaria"}, {"n": 16, "dc": "DC5", "titolo": "L'esperimento scientifico", "testo": "Sono un docente di scienze. Uso l'IA per simulare un esperimento chimico troppo pericoloso. Gli alunni osservano e annotano.", "norma": "DigCompEdu Area 3; DigComp DC5: simulazione come supporto didattico, con supervisione.", "livello": "Generico"}, {"n": 17, "dc": "DC4", "titolo": "Il compagno virtuale", "testo": "Sono una maestra di prima. Un genitore mi chiede se può far usare al figlio di 6 anni un'app IA per esercitarsi in lettura, da solo e senza supervisione.", "norma": "L. 132/2025, art. 4: per i minori di 14 anni accesso all’IA e relativo trattamento dati richiedono consenso genitoriale; DM 166/2025.", "livello": "Primaria"}, {"n": 18, "dc": "DC4", "titolo": "La lettera ai genitori", "testo": "Sono un docente. Uso l'IA per scrivere le comunicazioni alle famiglie e le osservazioni sugli alunni con BES, inserendo dettagli specifici sulla situazione di ogni studente.", "norma": "GDPR: minimizzazione, sicurezza e particolare cautela per dati relativi a salute/disabilità; DigCompEdu Area 2.", "livello": "Generico"}, {"n": 19, "dc": "DC3 + DC4", "titolo": "La foto ritoccata", "testo": "Ho 13 anni. Uso l'IA per modificare una foto del mio quartiere e mostrare come potrebbe cambiare con il clima.", "norma": "DigComp DC3 + DC4: rielaborazione, trasparenza didattica e media literacy.", "livello": "Sec. I grado"}, {"n": 20, "dc": "DC1", "titolo": "Il quiz generato", "testo": "Sono un docente di geografia. Uso l'IA per generare 50 domande di un quiz. Non verifico la correttezza delle domande prima della prova.", "norma": "Responsabilità del docente e controllo umano dei contenuti; DigCompEdu Area 4.", "livello": "Generico"}, {"n": 21, "dc": "DC3", "titolo": "La poesia generata", "testo": "Ho 10 anni. La maestra ci chiede di scrivere una poesia. La faccio generare all'IA. Tutti dicono che è bellissima.", "norma": "DigComp DC3: autorialità, rielaborazione e dichiarazione del contributo dell’IA.", "livello": "Primaria"}, {"n": 22, "dc": "DC4", "titolo": "Il profilo dell'alunno", "testo": "Sono dirigente di un liceo. Un'azienda ci propone gratuitamente un sistema IA che raccoglie dati e profila ogni studente per suggerire percorsi post-diploma personalizzati.", "norma": "AI Act, All. III 3(c): possibile alto rischio se il sistema valuta il livello/percorso educativo e incide materialmente sulle opportunità; GDPR e profilazione.", "livello": "Sec. II grado"}, {"n": 23, "dc": "DC3", "titolo": "La musica per lo spettacolo", "testo": "Ho 11 anni. Per lo spettacolo uso l'IA per comporre la musica. La presento come composizione del gruppo classe.", "norma": "Diritto d’autore e licenze; DigComp DC3: creazione e attribuzione.", "livello": "Sec. I grado"}, {"n": 24, "dc": "DC4 + DC3", "titolo": "Il colloquio con i genitori", "testo": "Sono un docente di terza media. Chiedo all'IA di generare un commento personalizzato per ogni alunno prima del colloquio, fornendole voti e note comportamentali di ciascuno studente.", "norma": "GDPR: dati scolastici e comportamentali; DM 166/2025: centralità della relazione educativa.", "livello": "Sec. I grado"}, {"n": 25, "dc": "DC3 + DC4", "titolo": "L'avatar della maestra", "testo": "Creo un avatar IA con la mia voce che i bambini possono interrogare a casa per ripassare. Non ho ancora spiegato ai bambini che si tratta di un sistema IA e non di me.", "norma": "AI Act art. 50(1): informare quando si interagisce con un sistema IA, salvo che sia evidente; DigCompEdu Area 5.", "livello": "Primaria"}, {"n": 26, "dc": "DC3", "titolo": "Il coding con l'IA", "testo": "Ho 12 anni. Per tecnologia chiedo all'IA di scrivere il codice di un gioco. Il prof mi chiede di spiegarlo. Non so rispondere.", "norma": "DigCompEdu Area 6; DigComp DC3: pensiero computazionale, comprensione e responsabilità sul codice.", "livello": "Sec. I grado"}, {"n": 27, "dc": "DC4", "titolo": "Il verbale della riunione", "testo": "Sono un docente. Uso l'IA per trascrivere e riassumere il verbale del consiglio di classe. Alcuni dettagli sensibili sugli alunni finiscono nel riassunto senza che me ne accorga.", "norma": "GDPR: riservatezza, minimizzazione e sicurezza dei dati; DigCompEdu Area 2.", "livello": "Generico"}, {"n": 28, "dc": "DC1", "titolo": "Il chatbot dell'open day", "testo": "Sono docente in un istituto tecnico. Per l'open day, la scuola installa sul sito un chatbot IA che risponde alle domande delle famiglie sugli indirizzi di studio. Alcune risposte non sono aggiornate e nessuno le controlla.", "norma": "AI Act art. 50(1): trasparenza sull’interazione con IA; controllo umano e qualità dell’informazione; DigCompEdu Area 1 + DC1.", "livello": "Sec. II grado"}, {"n": 29, "dc": "DC5", "titolo": "Il feedback senza voto", "testo": "Sono un'insegnante di scienze. Uso l'IA per generare un feedback scritto e formativo su un elaborato. Lo rileggo, lo personalizzo e lo firmo prima di consegnarlo all'alunno.", "norma": "Supervisione umana e responsabilità professionale; DigCompEdu Area 4; DigComp DC5.", "livello": "Generico"}, {"n": 30, "dc": "DC1", "titolo": "Il corso di aggiornamento", "testo": "Sono un docente. Per prepararmi a un corso di aggiornamento, uso l'IA per riassumere articoli scientifici complessi in un linguaggio più semplice da studiare.", "norma": "AI literacy; DigCompEdu Area 1; DigComp DC1: comprensione e verifica delle fonti.", "livello": "Generico"}, {"n": 31, "dc": "DC3", "titolo": "La tesina di maturità", "testo": "Ho 18 anni. Per l'esame di Stato devo preparare la tesina. Chiedo all'IA di costruire i collegamenti tra le materie e li presento come frutto del mio studio personale.", "norma": "Integrità e autorialità; DM 166/2025; DigComp DC3.", "livello": "Sec. II grado"}, {"n": 32, "dc": "DC2", "titolo": "Lo scambio linguistico", "testo": "Sono un docente di un liceo linguistico. Durante uno scambio con una scuola partner all'estero, uso l'IA per aiutare gli studenti a comunicare in tempo reale con i corrispondenti stranieri.", "norma": "Inclusione e collaborazione; DigCompEdu Area 3; DigComp DC2.", "livello": "Sec. II grado"}, {"n": 33, "dc": "DC3", "titolo": "Il progetto di PCTO", "testo": "Ho 17 anni. Per la relazione di PCTO (ex alternanza scuola-lavoro) uso l'IA per riorganizzare appunti sparsi in un testo coerente, poi lo rileggo e lo correggo io.", "norma": "Uso critico e supervisionato; DigComp DC3: rielaborazione e responsabilità sul prodotto finale.", "livello": "Sec. II grado"}, {"n": 34, "dc": "DC5", "titolo": "Il simulatore d'esame", "testo": "Sono un docente di un istituto tecnico. Uso l'IA per generare simulazioni della seconda prova d'esame di Stato, personalizzate per indirizzo di studio.", "norma": "DigCompEdu Area 4; DigComp DC5: simulazione, qualità dei contenuti e supervisione del docente.", "livello": "Sec. II grado"}, {"n": 35, "dc": "DC3", "titolo": "Il saggio breve", "testo": "Ho 16 anni. Mi alleno per l'esame di Stato scrivendo un saggio breve. Chiedo all'IA di scriverne uno come esempio, poi provo a scriverne uno simile da solo.", "norma": "DigComp DC3: IA come modello o supporto, non sostituto dell’elaborazione personale.", "livello": "Sec. II grado"}, {"n": 36, "dc": "DC5", "titolo": "Il tutor per la maturità", "testo": "Ho 19 anni, sto ripetendo l'anno. Ogni sera uso un tutor IA per prepararmi agli orali dell'esame di Stato: mi interroga e corregge le mie risposte.", "norma": "DigCompEdu Area 5; DigComp DC5: supporto personalizzato, autonomia e consapevolezza dei limiti.", "livello": "Sec. II grado"}];

}
function selectedText(side,idx){if(idx===-1)return `JOLLY — Formula oralmente un argomento ${side==="inn"?"PRO":"CONTRO"} personale pertinente alla situazione.`;return side==="inn"?PRO_CARDS[idx]:CONTRO_CARDS[idx]}
function renderDebate(){const n=names(),isInn=state.turno%2===0,cardIndex=Math.floor(state.turno/2),sel=isInn?state.selInn:state.selGua,idx=sel[cardIndex],col=isInn?"var(--pro)":"var(--contro)",name=isInn?n.inn:n.gua,text=selectedText(isInn?"inn":"gua",idx);shell(`<div class="wrap stack"><div class="center"><div class="tiny muted display">ARGOMENTAZIONE · CARTA ${cardIndex+1}/3 · TURNO ${state.turno+1}/6</div><h2 class="display" style="color:${col}">${isInn?"💡 Innovatore":"🛡️ Guardiano"} — ${esc(name)}</h2><p class="small muted">Argomenta la carta e collega il punto a un esempio o a una condizione concreta.</p></div>${cardHtml(col,isInn?"💡":"🛡️",isInn?"Innovatore — PRO":"Guardiano — CONTRO",`<p style="font-size:1.15rem;line-height:1.5;font-weight:700">${esc(text)}</p>`,idx===-1?"🃏 JOLLY":`${isInn?"PRO":"CONTRO"} · DOCENTI`)}<div class="note safe small"><strong>Esempi professionali:</strong> resta anonimo. Non citare nomi, diagnosi, voti, immagini, situazioni familiari o altri elementi che rendano riconoscibile uno studente o una famiglia.</div><div id="timerHost"></div><div class="center">${btn(state.turno<5?`Passa a ${esc(isInn?n.gua:n.inn)} ➜`:"Alle repliche finali ➜",col,"id=nextTurn")}</div></div>`);mountTimer('timerHost',state.tCarta,[15,30,45],col,'Tempo per la carta',v=>{state.tCarta=v;state.profilo="personalizzato"});document.getElementById('nextTurn').onclick=()=>{if(state.turno<5){state.turno++;render()}else setFase("replica")}}
function renderReplica(){const n=names(),isInn=state.replicaTurno===0,col=isInn?"var(--pro)":"var(--contro)",name=isInn?n.inn:n.gua,adv=isInn?n.gua:n.inn;shell(`<div class="wrap center stack"><h2 class="display" style="color:${col}">🎤 Replica finale — ${esc(name)}</h2><p class="muted">Rispondi a <b>un solo punto</b> sollevato da ${esc(adv)}.</p><div id="timerHost"></div>${btn(isInn?`Ora replica ${esc(n.gua)} ➜`:"Dibattito concluso ➜",col,"id=nextReplica")}</div>`);mountTimer('timerHost',state.tReplica,[30,45,60],col,'Tempo di replica',v=>{state.tReplica=v;state.profilo="personalizzato"});document.getElementById('nextReplica').onclick=()=>{if(isInn){state.replicaTurno=1;render()}else setFase('dopoPass')}}
function mountTimer(hostId,initial,options,color,label,onDuration){const host=document.getElementById(hostId);let dur=initial,left=initial,running=false;function draw(){host.innerHTML=`<div class="timer"><div class="tiny display" style="color:${color};letter-spacing:.12em;text-transform:uppercase">${label}</div><div class="ring" style="--pct:${dur?left/dur*100:0};--tc:${color}"><div class="ring-inner"><div class="seconds" style="color:${left<=5&&left>0?'#ff6b6b':'#fff'}">${left}</div><div class="tiny muted">SECONDI</div></div></div><div class="timeropts">${options.map(o=>`<button class="timeropt ${dur===o?'active':''}" style="--tc:${color}" data-dur="${o}">${o}s</button>`).join('')}</div><div class="row"><button class="btn slim" style="--c:${color}" id="timerStart">${running?'⏸ Pausa':'▶ Avvia'}</button><button class="btn slim ghost" style="--c:${color}" id="timerReset">↺ Reset</button></div></div>`;host.querySelectorAll('[data-dur]').forEach(b=>b.onclick=()=>{clearTimer();running=false;dur=+b.dataset.dur;left=dur;onDuration(dur);draw()});document.getElementById('timerStart').onclick=()=>{if(running){clearTimer();running=false;draw();return}if(left===0)left=dur;running=true;draw();timerHandle=setInterval(()=>{left--;if(left<=0){left=0;clearTimer();running=false;beep()}draw()},1000)};document.getElementById('timerReset').onclick=()=>{clearTimer();running=false;left=dur;draw()}}draw()}
function closeRound(){const r=roles(),n=names();let esito="Nessun punto: posizione finale sfumata.";if(state.dopo==="SI"){state.punti[r.inn]++;esito=`Punto all’Innovatore (${n.inn}).`}else if(state.dopo==="NO"){state.punti[r.gua]++;esito=`Punto al Guardiano (${n.gua}).`}state.storia.push({round:state.round+1,sit:state.sit,prima:state.prima,dopo:state.dopo,esito})}
function renderReveal(){const n=names(),p=OPINIONI.find(o=>o.id===state.prima),d=OPINIONI.find(o=>o.id===state.dopo),changed=state.prima!==state.dopo;let esito,col;if(state.dopo==="SI"){esito=`🏅 Punto all’Innovatore: ${n.inn}`;col="var(--pro)"}else if(state.dopo==="NO"){esito=`🏅 Punto al Guardiano: ${n.gua}`;col="var(--contro)"}else{esito="⚖️ Posizione sfumata: nessun punto. È un esito legittimo.";col="var(--oro)"}shell(`<div class="wrap center stack"><h2 class="display">✨ Doppio svelamento</h2><div class="reveal">${[["PRIMA",p],["DOPO",d]].map(([lab,o])=>`<div class="panel" style="border:3px solid ${o.col}"><div class="tiny display muted">${lab}</div><div style="font-size:2.6rem;margin:8px">${o.icon}</div><div class="display" style="font-size:1.5rem;color:${o.col}">${esc(o.label)}</div></div>`).join('')}</div><p>${changed?`💭 <b>${esc(n.oss)}</b> ha cambiato posizione: quale argomento o condizione ha inciso di più?`:`💭 <b>${esc(n.oss)}</b> ha confermato la posizione: quale argomento o condizione l’ha rafforzata?`}</p><div class="panel display" style="border:3px solid ${col};color:${col}">${esito}</div><div class="panel small" style="text-align:left;border:3px solid var(--sit)"><b style="color:var(--sit)">📚 Aggancio per la restituzione</b><div class="spacer"></div>${esc(state.sit.norma)}<div class="tiny muted" style="margin-top:8px">Il collegamento serve come aggancio formativo e non costituisce un giudizio automatico di liceità del caso specifico.</div></div>${btn(state.round<2?"Ruota i ruoli — round successivo ➜":"Vai al riepilogo finale ➜","var(--oro)","id=finishRound")}</div>`);document.getElementById('finishRound').onclick=()=>{closeRound();if(state.round<2){state.round++;setFase('roles')}else setFase('ranking')}}
function renderSummary(){shell(`<div class="wrap center stack">${triLogo(65)}<h2 class="display">Riepilogo finale</h2><p class="claim muted">AI Game Debate non si vince. Si esplora.</p><div class="stack">${state.nomi.map((n,i)=>`<div class="panel summaryrow" style="text-align:left;border:3px solid var(--oro)"><div class="points">${state.punti[i]}</div><div><div class="display">${esc(n)} — ${TITOLI[Math.min(state.punti[i],2)]}</div><div class="small muted">${SIG_TITOLI[Math.min(state.punti[i],2)]}</div></div></div>`).join('')}</div><div class="panel small" style="text-align:left;border:3px solid var(--sit)"><b style="color:var(--sit)">RIEPILOGO DEI ROUND</b>${state.storia.map(s=>`<p>R${s.round} · «${esc(s.sit.titolo)}» — PRIMA: ${esc(OPINIONI.find(o=>o.id===s.prima).label)} → DOPO: ${esc(OPINIONI.find(o=>o.id===s.dopo).label)}. ${esc(s.esito)}</p>`).join('')}</div>${btn("📔 Mini-Diario Riflessivo ➜","var(--pro)","id=toDiary")}</div>`,false);document.getElementById('toDiary').onclick=()=>setFase('diario')}
function renderDiary(){const qs=["Quale argomento mi ha spostato o ha rafforzato la mia posizione?","Quale opportunità o rischio avevo sottovalutato?","Quale condizione renderebbe l’uso dell’IA più responsabile nella mia pratica?","Quale micro-azione posso sperimentare nel mio contesto?"];shell(`<div class="wrap stack"><h2 class="display center">📔 Mini-Diario Riflessivo</h2><p class="center muted small">Compila individualmente. Non inserire nomi o dettagli identificabili di studenti o famiglie.</p>${state.nomi.map((n,pi)=>`<section class="panel diary-player" style="border:3px solid var(--oro)"><h3 class="display" style="color:var(--oro-dark)">🎯 ${esc(n)}</h3><div class="stack">${qs.map((q,qi)=>`<label class="question"><b class="small">${qi+1}. ${esc(q)}</b><textarea class="field diary" rows="3" data-p="${pi}" data-q="${qi}">${esc(state.diario[pi][qi]||'')}</textarea></label>`).join('')}</div></section>`).join('')}<div class="center no-print row" style="justify-content:center">${btn("🖨 Stampa / Salva PDF","var(--sit)","id=printDiary")}${btn("Concludi ➜","var(--oro)","id=endGame")}</div></div>`,false);document.querySelectorAll('.diary').forEach(t=>t.oninput=e=>{state.diario[+e.target.dataset.p][+e.target.dataset.q]=e.target.value});document.getElementById('printDiary').onclick=()=>window.print();document.getElementById('endGame').onclick=()=>setFase('fine')}

render();
</script>
</body>
</html>
