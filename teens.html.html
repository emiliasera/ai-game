.field{width:100%;border:2px solid #cdd4df;border-radius:12px;padding:11px 13px;color:var(--ink);background:#fff}.namebadge{width:34px;height:34px;flex:0 0 34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:900}.role{border:2px solid var(--c);padding:14px 10px;border-radius:16px;background:rgba(255,255,255,.06);text-align:center}.role .ico{font-size:1.7rem}.role .lab{font-size:.74rem;font-weight:900;letter-spacing:.08em;color:var(--c)}.role .nm{font-weight:800;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.choice{border:3px solid var(--c);background:var(--paper);border-radius:18px;padding:18px 10px;color:var(--c);text-align:center}.choice.selected{box-shadow:0 0 0 4px rgba(255,255,255,.9),0 0 0 8px var(--c)}.choice .ico{font-size:2.2rem}.choice .lab{font-size:1.25rem;font-weight:900}.choice .desc{font-size:.78rem;color:#667085;margin-top:5px}
.deck{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;max-height:50vh;overflow:auto;padding:4px}.arg{border:2.5px solid var(--c);background:var(--paper);color:var(--ink);border-radius:16px;padding:12px;text-align:left;line-height:1.25}.arg.selected{box-shadow:0 0 0 3px #fff,0 0 0 6px var(--c)}.arg.jolly{border-style:dashed;background:#fff8e6}.arg .num{font-weight:900;color:var(--c);margin-right:7px}
.dc-badge{display:inline-flex;align-items:center;justify-content:center;min-width:42px;padding:3px 8px;border-radius:999px;color:#fff;font-size:.72rem;font-weight:900;letter-spacing:.04em;margin-right:7px}.dc-1{background:var(--dc1);color:#4b3900}.dc-2{background:var(--dc2)}.dc-3{background:var(--dc3)}.dc-4{background:var(--dc4)}.dc-5{background:var(--dc5)}
.timer{display:grid;justify-items:center;gap:12px}.ring{--pct:100;--tc:#fff;width:136px;height:136px;border-radius:50%;padding:7px;background:conic-gradient(var(--tc) calc(var(--pct)*1%),rgba(255,255,255,.12) 0)}.ring-inner{height:100%;border-radius:50%;background:var(--navy-deep);display:grid;place-items:center;align-content:center}.seconds{font-size:2.6rem;font-weight:900}.timeropts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.timeropt{border:0;border-radius:999px;padding:6px 12px;color:#fff;font-weight:800;background:rgba(255,255,255,.1)}.timeropt.active{background:var(--tc)}
.reveal{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.summaryrow{display:flex;gap:16px;align-items:center}.points{font-size:2.2rem;color:var(--oro);font-weight:900;min-width:38px}.divider{height:1px;background:#d9dde5;margin:12px 0}.question{display:grid;gap:6px}.print-only{display:none}.no-print{}

.profile{border:2px solid var(--c);border-radius:14px;background:#fff;color:var(--ink);padding:12px;text-align:left}.profile.active{box-shadow:0 0 0 3px var(--c)}.profile b{color:var(--c)}
.credits{margin-top:12px;padding:14px 16px;border:1px solid rgba(255,255,255,.18);border-radius:14px;background:rgba(255,255,255,.055);text-align:left}
.credits .credit-title{font-weight:900;letter-spacing:.05em;text-transform:uppercase;color:#ffe28a;font-size:.78rem;margin-bottom:6px}

@media(max-width:650px){.grid3{grid-template-columns:1fr}.grid2,.deck,.reveal{grid-template-columns:1fr}.topbar{align-items:flex-start;flex-direction:column}.scores{justify-content:flex-start}.card-body{padding:18px}.app{padding:18px 12px}.role{display:grid;grid-template-columns:auto 1fr;column-gap:10px;align-items:center;text-align:left}.role .ico{grid-row:1/3}.role .nm{margin:0}}

.opt{display:flex;gap:10px;align-items:flex-start;font-size:.9rem;line-height:1.35;cursor:pointer;text-align:left}.opt input{color-scheme:light;accent-color:#1E8A3C;width:20px;height:20px;flex:0 0 20px;margin-top:2px}textarea.field{resize:vertical}
.arg.deckcard{width:100%;min-height:200px;display:flex;flex-direction:column;gap:12px;padding:18px;font-size:1.15rem;font-weight:700;line-height:1.4;margin-bottom:12px;box-shadow:6px 6px 0 -1px var(--paper),6px 6px 0 2px var(--c),12px 12px 0 -1px var(--paper),12px 12px 0 2px var(--c)}.arg.deckcard.selected{box-shadow:0 0 0 3px #fff,0 0 0 7px var(--c)}.arg.deckcard .hint{margin-top:auto;font-size:.76rem;font-weight:400;color:#667085}.arg.deckcard.turn{animation:turn .2s ease-out}@keyframes turn{from{transform:rotateY(80deg);opacity:.3}to{transform:none;opacity:1}}.selitem{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;border:2px solid var(--c);border-radius:12px;padding:8px 10px;font-size:.9rem;text-align:left;line-height:1.3}.selitem button{border:0;background:#eef0f4;color:#475467;width:30px;height:30px;flex:0 0 30px;border-radius:9px;font-weight:900}

<script>
"use strict";
const SITUAZIONI = [{"n": 1, "fascia": "Primo biennio", "dc": "DC1", "titolo": "La ricerca di scienze", "testo": "Ho 14 anni. Per una ricerca di biologia uso l'IA per trovare le informazioni, generare le immagini e scrivere il testo. Consegno tutto senza aver riletto una riga."}, {"n": 2, "fascia": "Primo biennio", "dc": "DC5", "titolo": "Il ripasso automatico", "testo": "Tra due giorni ho la verifica di storia. Chiedo all'IA di farmi domande a ripetizione e di prepararmi uno schema. Studio solo quello schema, niente libro."}, {"n": 3, "fascia": "Primo biennio", "dc": "DC1", "titolo": "Il problema copiato", "testo": "Non riesco a impostare un problema di geometria. Lo scrivo nell'IA e copio il procedimento. Alla correzione scopro che il procedimento era sbagliato."}, {"n": 4, "fascia": "Primo biennio", "dc": "DC3", "titolo": "Il tema delegato", "testo": "Devo scrivere un testo argomentativo per italiano. Non mi viene in mente niente, così lo faccio scrivere all'IA e lo consegno con il mio nome."}, {"n": 5, "fascia": "Primo biennio", "dc": "DC3", "titolo": "Il disegno del laboratorio", "testo": "Per disegno tecnico devo realizzare una tavola. Genero l'immagine con l'IA, la ricalco e la consegno come mio lavoro originale."}, {"n": 6, "fascia": "Primo biennio", "dc": "DC5", "titolo": "Il tutor per l'algebra", "testo": "Non capisco le equazioni. Chiedo all'IA di spiegarmele passo dopo passo, con esempi diversi da quelli del libro. Alla fine capisco e risolvo da solo gli esercizi."}, {"n": 7, "fascia": "Primo biennio", "dc": "DC2", "titolo": "La traduzione per il nuovo compagno", "testo": "In classe è arrivato un ragazzo che non parla italiano. Uso l'IA per tradurgli in tempo reale quello che dice il professore."}, {"n": 8, "fascia": "Primo biennio", "dc": "DC4", "titolo": "Lo scherzo con la voce clonata", "testo": "Con un'app clono la voce di un compagno di classe senza dirglielo. Gli faccio «dire» frasi imbarazzanti in un audio che gira nel gruppo della classe."}, {"n": 9, "fascia": "Primo biennio", "dc": "DC4", "titolo": "Il chatbot delle serate", "testo": "Certe sere mi sento giù e non ho voglia di parlarne con nessuno. Apro un chatbot e gli racconto tutto: mi sembra più paziente di chiunque altro."}, {"n": 10, "fascia": "Secondo biennio", "dc": "DC3", "titolo": "Le slide perfette", "testo": "Devo fare una presentazione di geografia. Chiedo all'IA di generare tutte le slide, testo e immagini comprese. Il risultato è curatissimo, ma quando devo esporla capisco poco di quello che dico."}, {"n": 11, "fascia": "Secondo biennio", "dc": "DC3", "titolo": "Il codice per l'esame di informatica", "testo": "Per l'esame pratico devo scrivere un programma. Lo faccio generare interamente dall'IA. Il professore mi chiede di modificare una riga davanti a lui: non so da dove cominciare."}, {"n": 12, "fascia": "Secondo biennio", "dc": "DC4", "titolo": "Il deepfake del personaggio storico", "testo": "Per un progetto interdisciplinare creo un video in cui un personaggio storico «parla» con la sua voce ricostruita dall'IA. Alcuni compagni, guardandolo, ci credono davvero."}, {"n": 13, "fascia": "Secondo biennio", "dc": "DC1", "titolo": "La mappa concettuale delegata", "testo": "Per l'interrogazione di scienze mi faccio generare una mappa concettuale perfetta dall'IA. La studio a memoria, ma quando il prof mi chiede di collegare due concetti non so rispondere."}, {"n": 14, "fascia": "Secondo biennio", "dc": "DC5", "titolo": "L'app che fotografa i compiti", "testo": "Un compagno mi consiglia un'app: basta fotografare l'esercizio e lei lo risolve. Inizio a usarla per tutti i compiti di matematica, ogni sera."}, {"n": 15, "fascia": "Secondo biennio", "dc": "DC3", "titolo": "La poesia che non ho scritto", "testo": "Per italiano dobbiamo scrivere un testo creativo su un tema libero. Lo faccio generare all'IA e lo presento come mio. Il professore lo legge in classe come esempio."}, {"n": 16, "fascia": "Secondo biennio", "dc": "DC4", "titolo": "Sorvegliati durante la verifica", "testo": "Per le verifiche al computer la scuola vuole adottare un software che ci osserva dalla webcam e segnala i «comportamenti sospetti». Dicono che così nessuno copia e le regole valgono per tutti."}, {"n": 17, "fascia": "Secondo biennio", "dc": "DC1", "titolo": "Il quiz con gli errori", "testo": "Il professore usa l'IA per generare un quiz di geografia di 40 domande. Due risposte sono sbagliate. Ce ne accorgiamo noi studenti, non lui."}, {"n": 18, "fascia": "Secondo biennio", "dc": "DC2", "titolo": "La petizione alla scuola", "testo": "La classe vuole chiedere alla dirigenza più tempo per la ricreazione. Usiamo l'IA per scrivere la lettera in modo formale ed efficace, ma le richieste e gli argomenti sono nostri."}, {"n": 19, "fascia": "Triennio e PCTO", "dc": "DC3", "titolo": "La relazione di PCTO", "testo": "Per la relazione di PCTO ho solo appunti sparsi presi durante lo stage. Li do in pasto all'IA che mi restituisce un testo coerente e ben scritto. Lo rileggo, ma non lo cambio quasi per niente."}, {"n": 20, "fascia": "Triennio e PCTO", "dc": "DC3", "titolo": "Il CV per il lavoro estivo", "testo": "Cerco un lavoro estivo. Chiedo all'IA di scrivermi il CV e la lettera di motivazione da zero, inserendo esperienze un po' gonfiate rispetto alla realtà."}, {"n": 21, "fascia": "Triennio e PCTO", "dc": "DC1", "titolo": "La sfida tra compagni", "testo": "Io e un compagno facciamo la stessa ricerca per un progetto: lui usa solo l'IA, io solo fonti tradizionali. Confrontiamo i risultati e troviamo differenze che non ci aspettavamo."}, {"n": 22, "fascia": "Triennio e PCTO", "dc": "DC5", "titolo": "Il tutor per la teoria della patente", "testo": "Devo prepararmi per l'esame di teoria della patente. Uso un'app IA che mi fa domande a raffica finché non rispondo bene a tutte, anche a tarda sera."}, {"n": 23, "fascia": "Triennio e PCTO", "dc": "DC3", "titolo": "I contenuti per i social della classe", "testo": "Gestisco il profilo social della mia classe. Uso l'IA per generare didascalie e piccoli video accattivanti sugli eventi scolastici, risparmiando ore di lavoro."}, {"n": 24, "fascia": "Triennio e PCTO", "dc": "DC1", "titolo": "La notizia da verificare", "testo": "Vedo una notizia virale sui social. Chiedo all'IA se è vera. Mi risponde con sicurezza, ma non cita alcuna fonte verificabile."}, {"n": 25, "fascia": "Triennio e PCTO", "dc": "DC5", "titolo": "Il colloquio simulato", "testo": "Ho il primo vero colloquio di lavoro della mia vita. La sera prima mi alleno con un tutor IA che mi fa domande e mi dà un feedback su come rispondo."}, {"n": 26, "fascia": "Triennio e PCTO", "dc": "DC4", "titolo": "La foto dell'evento scolastico", "testo": "Per il sito della scuola ritocco con l'IA una foto della festa di fine anno, rendendola più luminosa e «perfetta». La pubblico senza specificare che è stata modificata."}, {"n": 27, "fascia": "Triennio e PCTO", "dc": "DC5", "titolo": "Il compagno che fa i compiti a tutti", "testo": "Nel nostro gruppo di studio, uno di noi ha iniziato a far fare tutti i compiti all'IA e li distribuisce agli altri ogni sera prima delle lezioni."}, {"n": 28, "fascia": "Ultimo anno e Maturità", "dc": "DC3", "titolo": "La tesina della maturità", "testo": "Per l'Esame di Stato devo costruire i collegamenti tra le materie per il colloquio. Chiedo all'IA di trovarli tutti al posto mio e li presento come frutto del mio studio personale."}, {"n": 29, "fascia": "Ultimo anno e Maturità", "dc": "DC3", "titolo": "Il saggio breve d'allenamento", "testo": "Mi alleno per la prima prova scrivendo un saggio breve. Chiedo all'IA di scriverne uno come esempio, poi provo a scriverne uno simile da solo, confrontando lo stile."}, {"n": 30, "fascia": "Ultimo anno e Maturità", "dc": "DC5", "titolo": "Il tutor per gli orali", "testo": "Ogni sera, nell'ultimo mese prima della maturità, uso un tutor IA che mi interroga e corregge le mie risposte, un po' come farebbe un compagno di studio molto paziente."}, {"n": 31, abel class="opt"><input type="checkbox" id="optBreve" ${state.breve?"checked":""}> <span><b>Versione breve</b> · 1 carta a testa, 30 secondi per intervento, nessuna replica finale. I 3 round e la rotazione restano.</span></label><label class="opt"><input type="checkbox" id="optNoPunti" ${state.senzaPunti?"checked":""}> <span><b>Senza punteggio</b> · conta solo il confronto PRIMA/DOPO.</span></label></section><div class="center">${btn("🎮 INIZIA LA PARTITA","var(--oro)","id=startGame disabled")}<p class="tiny muted">Il gioco funziona anche offline: non richiede librerie o servizi esterni.</p></div>${creditsBlock()}</div>`,false);
 document.querySelectorAll('.name-input').forEach(el=>el.addEventListener('input',e=>{state.nomi[+e.target.dataset.i]=e.target.value;document.getElementById('startGame').disabled=state.nomi.some(x=>!x.trim())}));
 document.querySelectorAll('[data-profile]').forEach(el=>el.onclick=()=>profileSet(el.dataset.profile));document.getElementById('percorso').onchange=e=>{state.percorso=e.target.value};document.getElementById('optBreve').onchange=e=>{state.breve=e.target.checked};document.getElementById('optNoPunti').onchange=e=>{state.senzaPunti=e.target.checked};
 const b=document.getElementById('startGame');b.disabled=state.nomi.some(x=>!x.trim());b.onclick=avvia;
}
function avvia(){state.nomi=state.nomi.map(x=>x.trim());state.mazzo=shuffle(SITUAZIONI.filter(PERCORSI[state.percorso].f)).slice(0,3);if(state.breve)state.tCarta=30;state.round=0;state.punti=[0,0,0];state.storia=[];state.diario=[{},{},{}];setFase("roles")}
function resetGame(){state={fase:"setup",nomi:["","",""] ,profilo:"standard",tCarta:30,tReplica:45,mazzo:[],round:0,punti:[0,0,0],sit:null,prima:null,dopo:null,selInn:[],selGua:[],turno:0,replicaTurno:0,storia:[],diario:[{},{},{}],percorso:"tutte",breve:false,senzaPunti:false};render()}
function iniziaRound(){state.sit=state.mazzo[state.round];state.prima=null;state.dopo=null;state.selInn=[];state.selGua=[];state.turno=0;state.replicaTurno=0;setFase("situazione")}

function renderOpinion(which){const isPrima=which==="prima",cur=isPrima?state.prima:state.dopo,n=names();shell(`<div class="wrap center stack"><h2 class="display">🎯 La tua opinione ${isPrima?"PRIMA":"DOPO"}</h2><p class="muted small">${isPrima?"Che cosa pensi prima di ascoltare gli argomenti?":"Qual è la tua posizione adesso? "+(state.senzaPunti?"":"Il punto segue soltanto questa scelta. ")+"La scelta PRIMA non limita le opzioni disponibili."}</p><div class="grid2">${OPINIONI.map(o=>`<button class="choice ${cur===o.id?"selected":""}" style="--c:${o.col}" data-op="${o.id}"><div class="ico">${o.icon}</div><div class="lab">${esc(o.label)}</div><div class="desc">${esc(o.desc)}</div></button>`).join("")}</div>${btn("Confermo: resta segreta 🂠","var(--oro)",`id=confirmOpinion ${cur?"":"disabled"}`)}<p class="tiny muted">Nel gioco digitale PRIMA e DOPO sono due set indipendenti: puoi confermare la stessa opinione oppure cambiarla.</p></div>`);
 document.querySelectorAll('[data-op]').forEach(el=>el.onclick=()=>{if(isPrima)state.prima=el.dataset.op;else state.dopo=el.dataset.op;render()});
 document.getElementById('confirmOpinion').onclick=()=>setFase(isPrima?"pickInnPass":"reveal")
}
function toggleSelection(side,idx){const key=side==="inn"?"selInn":"selGua",arr=state[key];const pos=arr.indexOf(idx);if(pos>=0)arr.splice(pos,1);else if(arr.length<nCarte())arr.push(idx);render()}
function renderPick(isInn){const n=names(),deck=isInn?PRO_CARDS:CONTRO_CARDS,key=isInn?"selInn":"selGua",sel=state[key],col=isInn?"var(--pro)":"var(--contro)",name=isInn?n.inn:n.gua,role=isInn?"💡 Innovatore":"🛡️ Guardiano",lab=isInn?"PRO":"CONTRO",tot=deck.length+1;let pos=0;
 const cardText=idx=>idx===-1?`Formula oralmente un argomento ${lab} personale, pertinente alla situazione e non già presente nel mazzo.`:deck[idx].t;
 shell(`<div class="wrap stack"><div class="center"><h2 class="display" style="color:${col}">${role} — <span style="color:#fff">${esc(name)}</span></h2><p class="small muted">Tocca la carta per girare il mazzo ${lab}: 26 carte fisse + 1 Jolly. Quando trovi un argomento pertinente, fermati e sceglilo. Ti ${state.breve?"serve <b>1 carta</b>":"servono <b>3 carte</b>"}.</p></div><button class="arg deckcard" id="deckCard" style="--c:${col}" aria-label="Gira il mazzo ${lab}"><span class="row between"><span id="deckTag"></span><span class="num" id="deckCnt" style="margin:0"></span></span><span id="deckTxt" aria-live="polite"></span><span class="hint">👆 Tocca la carta per girare il mazzo</span></button><div class="row" style="justify-content:center;flex-wrap:wrap"><button class="btn slim ghost" style="--c:${col}" id="deckPrev">◀ Carta precedente</button><button class="btn" style="--c:${col}" id="deckPick"></button></div><div class="panel" style="padding:14px;--c:${col}"><b class="small" style="color:${col}">Le tue carte <span id="selCnt"></span></b><div id="selList" class="stack" style="gap:8px;margin-top:8px"></div></div><div class="note safe small"><strong>Regola Jolly:</strong> non si compila e non si scrive. Se la scegli, formulerai l’argomento oralmente durante il tuo turno.</div><div class="center">${btn(isInn?"Conferma e passa al Guardiano ➜":"Conferma: inizia il dibattito 🔥",col,"id=confirmPick disabled")}</div></div>`);
 const $=id=>document.getElementById(id),cur=()=>pos<deck.length?pos:-1;
 const sync=()=>{const idx=cur(),isSel=sel.includes(idx),full=sel.length>=nCarte();$("deckTag").innerHTML=idx===-1?'<span class="num" style="margin:0">🃏 JOLLY</span>':`<span class="dc-badge ${dcClass(deck[idx].dc)}">${esc(deck[idx].dc)}</span>`;$("deckCnt").textContent=`${pos+1}/${tot}`;$("deckTxt").textContent=cardText(idx);$("deckCard").classList.toggle("jolly",idx===-1);$("deckCard").classList.toggle("selected",isSel);$("deckPick").textContent=isSel?"✓ Scelta · tocca per toglierla":full?`Hai già ${nCarte()===1?"la tua carta":"3 carte"}`:"Scelgo questa carta";$("deckPick").disabled=!isSel&&full;$("selCnt").textContent=`${sel.length}/${nCarte()}`;$("selList").innerHTML=sel.length?sel.map(i=>`<div class="selitem"><span><b>${i===-1?"🃏 JOLLY":(i+1)+"."}</b> ${esc(i===-1?"Argomento "+lab+" personale, formulato a voce.":deck[i].t)}</span><button data-rm="${i}" aria-label="Togli questa carta">×</button></div>`).join(""):'<span class="small" style="color:#667085">Nessuna carta scelta.</span>';$("selList").querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{sel.splice(sel.indexOf(+b.dataset.rm),1);sync()});$("confirmPick").disabled=sel.length!==nCarte()};
 const turn=d=>{pos=(pos+d+tot)%tot;const c=$("deckCard");c.classList.remove("turn");void c.offsetWidth;c.classList.add("turn");sync()};
 $("deckCard").onclick=()=>turn(1);$("deckPrev").onclick=()=>turn(-1);$("deckPick").onclick=()=>{const idx=cur(),p=sel.indexOf(idx);if(p>=0)sel.splice(p,1);else if(sel.length<nCarte())sel.push(idx);sync()};$("confirmPick").onclick=()=>setFase(isInn?"pickGuaPass":"debate");sync()
}
function selectedText(side,idx){if(idx===-1)return `JOLLY — Formula oralmente un argomento ${side==="inn"?"PRO":"CONTRO"} personale pertinente alla situazione.`;const c=side==="inn"?PRO_CARDS[idx]:CONTRO_CARDS[idx];return c.t}
function selectedDc(side,idx){if(idx===-1)return "JOLLY";const c=side==="inn"?PRO_CARDS[idx]:CONTRO_CARDS[idx];return c.dc}
function renderDebate(){const n=names(),isInn=state.turno%2===0,cardIndex=Math.floor(state.turno/2),sel=isInn?state.selInn:state.selGua,idx=sel[cardIndex],col=isInn?"var(--pro)":"var(--contro)",name=isInn?n.inn:n.gua,text=selectedText(isInn?"inn":"gua",idx),dc=selectedDc(isInn?"inn":"gua",idx);shell(`<div class="wrap stack"><div class="center"><div class="tiny muted display">ARGOMENTAZIONE · CARTA ${cardIndex+1}/${nCarte()} · TURNO ${state.turno+1}/${nCarte()*2}</div><h2 class="display" style="color:${col}">${isInn?"💡 Innovatore":"🛡️ Guardiano"} — ${esc(name)}</h2><p class="small muted">Argomenta la carta e collega il punto a un esempio scolastico, extrascolastico o a una condizione concreta.</p></div>${cardHtml(col,isInn?"💡":"🛡️",isInn?"Innovatore — PRO":"Guardiano — CONTRO",`<div style="margin-bottom:10px"><span class="dc-badge ${dcClass(dc)}">${esc(dc)}</span></div><p style="font-size:1.15rem;line-height:1.5;font-weight:700">${esc(text)}</p>`,idx===-1?"🃏 JOLLY":`${isInn?"PRO":"CONTRO"} · TEENS`)}<div class="note safe small"><strong>Esempi reali:</strong> evita nomi, immagini o dettagli che rendano riconoscibili compagni o altre persone. Discuti il problema, non il caso personale di qualcuno.</div><div id="timerHost"></div><div class="center">${btn(state.turno<nCarte()*2-1?`Passa a ${esc(isInn?n.gua:n.inn)} ➜`:(state.breve?"Dibattito concluso ➜":"Alle repliche finali ➜"),col,"id=nextTurn")}</div></div>`);mountTimer('timerHost',state.tCarta,[15,30,45],col,'Tempo per la carta',v=>{state.tCarta=v;state.profilo="personalizzato"});document.getElementById('nextTurn').onclick=()=>{if(state.turno<nCarte()*2-1){state.turno++;render()}else setFase(state.breve?"dopoPass":"replica")}}
function renderReplica(){const n=names(),isInn=state.replicaTurno===0,col=isInn?"var(--pro)":"var(--contro)",name=isInn?n.inn:n.gua,adv=isInn?n.gua:n.inn;shell(`<div class="wrap center stack"><h2 class="display" style="color:${col}">🎤 Replica finale — ${esc(name)}</h2><p class="muted">Rispondi a <b>un solo punto</b> sollevato da ${esc(adv)}.</p><div id="timerHost"></div>${btn(isInn?`Ora replica ${esc(n.gua)} ➜`:"Dibattito concluso ➜",col,"id=nextReplica")}</div>`);mountTimer('timerHost',state.tReplica,[30,45,60],col,'Tempo di replica',v=>{state.tReplica=v;state.profilo="personalizzato"});document.getElementById('nextReplica').onclick=()=>{if(isInn){state.replicaTurno=1;render()}else setFase('dopoPass')}}
function mountTimer(hostId,initial,options,color,label,onDuration){const host=document.getElementById(hostId);let dur=initial,left=initial,running=false;function draw(){host.innerHTML=`<div class="timer"><div class="tiny display" style="color:${color};letter-spacing:.12em;text-transform:uppercase">${label}</div><div class="ring" style="--pct:${dur?left/dur*100:0};--tc:${color}"><div class="ring-inner"><div class="seconds" style="color:${left<=5&&left>0?'#ff6b6b':'#fff'}">${left}</div><div class="tiny muted">SECONDI</div></div></div><div class="timeropts">${options.map(o=>`<button class="timeropt ${dur===o?'active':''}" style="--tc:${color}" data-dur="${o}">${o}s</button>`).join('')}</div><div class="row"><button class="btn slim" style="--c:${color}" id="timerStart">${running?'⏸ Pausa':'▶ Avvia'}</button><button class="btn slim ghost" style="--c:${color}" id="timerReset">↺ Reset</button></div></div>`;host.querySelectorAll('[data-dur]').forEach(b=>b.onclick=()=>{clearTimer();running=false;dur=+b.dataset.dur;left=dur;onDuration(dur);draw()});document.getElementById('timerStart').onclick=()=>{if(running){clearTimer();running=false;draw();return}if(left===0)left=dur;running=true;draw();timerHandle=setInterval(()=>{left--;if(left<=0){left=0;clearTimer();running=false;beep()}draw()},1000)};document.getElementById('timerReset').onclick=()=>{clearTimer();running=false;left=dur;draw()}}draw()}
function closeRound(){const r=roles(),n=names();let esito="Nessun punto: posizione finale sfumata.";if(state.senzaPunti){esito="Versione senza punteggio."}else if(state.dopo==="SI"){state.punti[r.inn]++;esito=`Punto all’Innovatore (${n.inn}).`}else if(state.dopo==="NO"){state.punti[r.gua]++;esito=`Punto al Guardiano (${n.gua}).`}state.storia.push({round:state.round+1,sit:state.sit,prima:state.prima,dopo:state.dopo,esito})}
function renderReveal(){const n=names(),p=OPINIONI.find(o=>o.id===state.prima),d=OPINIONI.find(o=>o.id===state.dopo),changed=state.prima!==state.dopo;let esito,col;if(state.dopo==="SI"){esito=`🏅 Punto all’Innovatore: ${n.inn}`;col="var(--pro)"}else if(state.dopo==="NO"){esito=`🏅 Punto al Guardiano: ${n.gua}`;col="var(--contro)"}else{esito="⚖️ Posizione sfumata: nessun punto. È un esito legittimo.";col="var(--oro)"}if(state.senzaPunti){esito="⚖️ Versione senza punteggio: conta il confronto tra PRIMA e DOPO.";col="var(--oro)"}shell(`<div class="wrap center stack"><h2 class="display">✨ Doppio svelamento</h2><div class="reveal">${[["PRIMA",p],["DOPO",d]].map(([lab,o])=>`<div class="panel" style="border:3px solid ${o.col}"><div class="tiny display muted">${lab}</div><div style="font-size:2.6rem;margin:8px">${o.icon}</div><div class="display" style="font-size:1.5rem;color:${o.col}">${esc(o.label)}</div></div>`).join('')}</div><p>${changed?`💭 <b>${esc(n.oss)}</b> ha cambiato posizione: quale argomento o condizione ha inciso di più?`:`💭 <b>${esc(n.oss)}</b> ha confermato la posizione: quale argomento o condizione l’ha rafforzata?`}</p><div class="panel display" style="border:3px solid ${col};color:${col}">${esito}</div><div class="panel small" style="text-align:left;border:3px solid var(--sit)"><b style="color:var(--sit)">📚 Aggancio per la restituzione</b><div class="spacer"></div>${aggancioSituazione(state.sit)}<div class="tiny muted" style="margin-top:8px">Il collegamento serve alla restituzione didattica. Le situazioni non hanno tutte un esito univoco; quando interviene un vincolo normativo netto, va esplicitato dopo il dibattito.</div></div>${btn(state.round<2?"Ruota i ruoli — round successivo ➜":"Vai al riepilogo finale ➜","var(--oro)","id=finishRound")}</div>`);document.getElementById('finishRound').onclick=()=>{closeRound();if(state.round<2){state.round++;setFase('roles')}else setFase('ranking')}}
function renderSummary(){shell(`<div class="wrap center stack">${triLogo(65)}<h2 class="display">Riepilogo finale</h2><p class="claim muted">AI Game Debate non si vince. Si esplora.</p><div class="stack">${state.senzaPunti?"":state.nomi.map((n,i)=>`<div class="panel summaryrow" style="text-align:left;border:3px solid var(--oro)"><div class="points">${state.punti[i]}</div><div><div class="display">${esc(n)} — ${TITOLI[Math.min(state.punti[i],2)]}</div><div class="small muted">${SIG_TITOLI[Math.min(state.punti[i],2)]}</div></div></div>`).join('')}</div><div class="panel small" style="text-align:left;border:3px solid var(--sit)"><b style="color:var(--sit)">RIEPILOGO DEI ROUND</b>${state.storia.map(s=>`<p>R${s.round} · «${esc(s.sit.titolo)}» — PRIMA: ${esc(OPINIONI.find(o=>o.id===s.prima).label)} → DOPO: ${esc(OPINIONI.find(o=>o.id===s.dopo).label)}. ${esc(s.esito)}</p>`).join('')}</div>${btn("📔 Mini-Diario Riflessivo ➜","var(--pro)","id=toDiary")}</div>`,false);document.getElementById('toDiary').onclick=()=>setFase('diario')}
function renderDiary(){const qs=["Cosa pensavo dell’IA prima di giocare?","Quale argomento PRO o CONTRO mi ha fatto riflettere di più?","Cosa farò di diverso la prossima volta che userò l’IA?"];shell(`<div class="wrap stack"><h2 class="display center">📔 Mini-Diario Riflessivo</h2><p class="center muted small">Compila individualmente. Se citi episodi reali, non inserire nomi o dettagli che rendano riconoscibili altre persone.</p>${state.nomi.map((n,pi)=>`<section class="panel diary-player" style="border:3px solid var(--oro)"><h3 class="display" style="color:var(--oro-dark)">🎯 ${esc(n)}</h3><div class="stack">${qs.map((q,qi)=>`<label class="question"><b class="small">${qi+1}. ${esc(q)}</b><textarea class="field diary" rows="3" data-p="${pi}" data-q="${qi}">${esc(state.diario[pi][qi]||'')}</textarea></label>`).join('')}<div class="question"><b class="small">Il ruolo che mi ha messo più in difficoltà</b><div class="row" style="flex-wrap:wrap">${["Osservatore","Innovatore","Guardiano"].map(ru=>`<label class="small"><input type="radio" class="diary-role" name="ruolo${pi}" value="${ru}" data-p="${pi}" ${state.diario[pi].ruolo===ru?"checked":""}> ${ru}</label>`).join('')}</div><label class="question"><span class="small">Perché:</span><textarea class="field diary-why" rows="2" data-p="${pi}">${esc(state.diario[pi].perche||'')}</textarea></label></div></div></section>`).join('')}<div class="center no-print row" style="justify-content:center">${btn("🖨 Stampa / Salva PDF","var(--sit)","id=printDiary")}${btn("Concludi ➜","var(--oro)","id=endGame")}</div></div>`,false);document.querySelectorAll('.diary').forEach(t=>t.oninput=e=>{state.diario[+e.target.dataset.p][+e.target.dataset.q]=e.target.value});document.querySelectorAll('.diary-role').forEach(t=>t.onchange=e=>{state.diario[+e.target.dataset.p].ruolo=e.target.value});document.querySelectorAll('.diary-why').forEach(t=>t.oninput=e=>{state.diario[+e.target.dataset.p].perche=e.target.value});document.getElementById('printDiary').onclick=()=>window.print();document.getElementById('endGame').onclick=()=>setFase('fine')}

render();
</script>
</body>
